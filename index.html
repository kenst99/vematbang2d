 const b=bbox(r.pts),I=8,ix1=b.x1+I,iy1=b.y1+I,ix2=b.x2-I,iy2=b.y2-I,W=ix2-ix1,Hh=iy2-iy1;if(W<60||Hh<60)return 0;
 const doors=S.openings.map(o=>{const g=og(o);if(!g||!onBoundary(g.cx,g.cy,r,g.t/2+4))return null;return {x:g.cx,y:g.cy,r:o.kind==='door'&&o.type!=='garage'?o.w+12:(o.type==='garage'?60:0),win:o.kind==='window'}}).filter(Boolean);
 const rects=S.items.filter(it=>it.type!=='rug'&&pip(it.x,it.y,r.pts)).map(aabb);const added=[];
 const onSide=(z,s)=>s==='top'?Math.abs(z.y-b.y1)<15:s==='bottom'?Math.abs(z.y-b.y2)<15:s==='left'?Math.abs(z.x-b.x1)<15:Math.abs(z.x-b.x2)<15;
 const sides=['top','right','bottom','left'].map(s=>({s,len:(s==='top'||s==='bottom')?W:Hh,nd:doors.filter(z=>!z.win&&onSide(z,s)).length})).sort((a,c)=>a.nd-c.nd||c.len-a.len).map(x=>x.s);
 const opp={top:'bottom',bottom:'top',left:'right',right:'left'},ROT={top:0,right:90,bottom:180,left:270};
 const ok=(cx,cy,hw,hd)=>{if(cx-hw<ix1-1||cx+hw>ix2+1||cy-hd<iy1-1||cy+hd>iy2+1)return false;for(const [px,py] of [[cx,cy],[cx-hw+1,cy-hd+1],[cx+hw-1,cy-hd+1],[cx+hw-1,cy+hd-1],[cx-hw+1,cy+hd-1]])if(!pip(px,py,r.pts))return false;for(const q of rects)if(cx-hw<q.x2-2&&cx+hw>q.x1+2&&cy-hd<q.y2-2&&cy+hd>q.y1+2)return false;for(const z of doors){if(!z.r)continue;const nx=clamp(z.x,cx-hw,cx+hw),ny=clamp(z.y,cy-hd,cy+hd);if(hyp(nx-z.x,ny-z.y)<z.r)return false}return true};
 const put=(type,cx,cy,rot,o={},solid=true)=>{const it=addItem(type,r1(cx),r1(cy),{rot,w:o.w,d:o.d});if(solid)rects.push(aabb(it));added.push(it);return it};
 const wallPlace=(type,sl,fr=[.5,.3,.7,.15,.85,0,1],o={})=>{const F=FURN[type];const w=o.w||F.w,d=o.d||F.d;for(const s of sl){const hz=s==='top'||s==='bottom';const span=hz?W:Hh;if(w>span)continue;for(const f of fr){let cx,cy;if(hz){cx=ix1+w/2+f*(W-w);cy=s==='top'?iy1+d/2:iy2-d/2}else{cy=iy1+w/2+f*(Hh-w);cx=s==='left'?ix1+d/2:ix2-d/2}if(ok(cx,cy,hz?w/2:d/2,hz?d/2:w/2))return Object.assign(put(type,cx,cy,ROT[s],o),{_side:s})}}return null};

   wallPlace('wardrobe',rest,[.85,.15,.5,1,0])||wallPlace('wardrobe',rest,[.85,.15,.5,1,0],{w:120});

  case 'living':{const sofa=wallPlace(Math.max(W,Hh)>=330?'sofa3':'sofa2',sides);if(sofa){const s=sofa._side;wallPlace('tv',[opp[s]],[.5,.4,.6,.3,.7]);const fc=frontOf(sofa,35+FURN.coffee.d/2),hz=s==='top'||s==='bottom';put('rug',fc.x,fc.y,hz?0:90,{w:220,d:150},false);if(ok(fc.x,fc.y,hz?55:30,hz?30:55))put('coffee',fc.x,fc.y,hz?0:90);freePlace('armchair',{near:{x:fc.x+(hz?120:0),y:fc.y+(hz?0:120)}})}else freePlace('sofa2');corner('plant');wallPlace('shelf',sides.slice(1),[1,0]);break}

const DOORS={single:{n:'Cửa đơn',w:80},main:{n:'Cửa chính',w:100},double:{n:'Cửa đôi',w:140},sliding:{n:'Cửa trượt',w:160},open:{n:'Lối đi trống',w:90},garage:{n:'Cửa cuốn',w:300}};
const WINS={win:{n:'Cửa sổ',w:120},win2:{n:'Cửa sổ lớn',w:180},glass:{n:'Vách kính',w:240},small:{n:'Cửa sổ nhỏ',w:60}};
function og(o){const w=S.walls.find(v=>v.id===o.wall);if(!w)return null;const [ux,uy]=wdir(w);return {w,ux,uy,nx:-uy,ny:ux,t:w.t,L:wlen(w),cx:w.x1+ux*o.pos,cy:w.y1+uy*o.pos}}
function autoSide(o){const g=og(o);if(!g)return true;const a=roomAt(g.cx+g.nx*(g.t/2+40),g.cy+g.ny*(g.t/2+40)),b=roomAt(g.cx-g.nx*(g.t/2+40),g.cy-g.ny*(g.t/2+40));if(a&&!b)return true;if(b&&!a)return false;if(a&&b)return areaM2(a)<=areaM2(b);return true}
function nearestWall(x,y,tol){let best=null,bd=1e9;for(const w of S.walls){const p=projW(x,y,w);if(p.s<-5||p.s>p.L+5)continue;const d=Math.abs(p.n)-w.t/2;if(d<bd&&d<=tol){bd=d;best={w,s:clamp(p.s,0,p.L),n:p.n}}}return best}
function placeOpening(kind,type,x,y,width,tol){const nw=nearestWall(x,y,tol);if(!nw)return null;const L=wlen(nw.w),T=(kind==='door'?DOORS:WINS)[type]?type:(kind==='door'?'single':'win');let W=+width||(kind==='door'?DOORS:WINS)[T].w;if(W>L-10)W=Math.max(30,L-10);let pos=nw.s;if(PREF.snap)pos=Math.round(pos/5)*5;pos=clamp(pos,W/2,L-W/2);const o={id:nid('o'),kind,type:T,wall:nw.w.id,pos,w:W,flip:false,side:true};S.openings.push(o);o.side=autoSide(o);return o}
function clampOpenings(w){const L=wlen(w);for(const o of S.openings)if(o.wall===w.id){if(o.w>L-4)o.w=Math.max(20,L-4);o.pos=clamp(o.pos,o.w/2,L-o.w/2)}}

let wallT=LS.get('mb_wallT',20);
function addWall(x1,y1,x2,y2,t){const w={id:nid('w'),x1,y1,x2,y2,t:+t||wallT,h:300};S.walls.push(w);return w}
function addWallDedupe(x1,y1,x2,y2,t){const L=hyp(x2-x1,y2-y1);if(L<3)return [];const cov=[];for(const w of S.walls){const a=proj(w.x1,w.y1,x1,y1,x2,y2),b=proj(w.x2,w.y2,x1,y1,x2,y2);if(Math.abs(a.n)<2&&Math.abs(b.n)<2){const s1=Math.min(a.s,b.s),s2=Math.max(a.s,b.s);if(s2>0&&s1<L)cov.push([Math.max(0,s1),Math.min(L,s2)])}}
 cov.sort((p,q)=>p[0]-q[0]);const out=[];let c=0;for(const [s,e] of cov){if(s>c+2)out.push([c,s]);c=Math.max(c,e)}if(L-c>2)out.push([c,L]);
 const ux=(x2-x1)/L,uy=(y2-y1)/L;return out.map(([s,e])=>addWall(r1(x1+ux*s),r1(y1+uy*s),r1(x1+ux*e),r1(y1+uy*e),t))}
function uniqName(base){base=String(base||'Phòng').trim();const ex=S.rooms.filter(r=>r.name===base||r.name.startsWith(base+' ')).length;return ex?base+' '+(ex+1):base}

function createUp(sx,sy,wx,wy,e){const dragged=dn&&dn.moved;const free=e&&e.altKey;
 if(tool==='wall'){if(!chain){const s=dn.snap||snapPt(wx,wy);if(dragged){const p=snapPt(wx,wy,{from:s,free});if(hyp(p.x-s.x,p.y-s.y)>=5){addWall(s.x,s.y,p.x,p.y,wallT);chain={x:p.x,y:p.y,pts:[[s.x,s.y],[p.x,p.y]]};commit()}}else chain={x:s.x,y:s.y,pts:[[s.x,s.y]]}}
  else{const p=snapPt(wx,wy,{from:chain,free});if(hyp(p.x-chain.x,p.y-chain.y)>=5)extendChain(p.x,p.y)}
  updDone();renderOpts();updPrev(wx,wy,e);req();return}
 if(tool==='room'){if(roomOpt.mode==='rect'){const p=snapPt(wx,wy,{free});if(!rectStart){const s=dn.snap||p;if(dragged&&Math.abs(p.x-s.x)>=30&&Math.abs(p.y-s.y)>=30)makeRect(s,p);else rectStart=s}else{if(Math.abs(p.x-rectStart.x)>=30&&Math.abs(p.y-rectStart.y)>=30)makeRect(rectStart,p);else toast('Phòng quá nhỏ (tối thiểu 30 cm)');rectStart=null}}
  else{const l=poly&&poly[poly.length-1];const p=snapPt(wx,wy,{from:l?{x:l[0],y:l[1]}:null,free});if(!poly)poly=[[p.x,p.y]];else{const [fx,fy]=[poly[0][0]*V.z+V.ox,poly[0][1]*V.z+V.oy];if(poly.length>=3&&hyp(fx-sx,fy-sy)<16){finishPoly();return}if(hyp(p.x-l[0],p.y-l[1])>=5)poly.push([p.x,p.y])}}
  updDone();req();return}
 if(tool==='dim'){const p=snapPt(wx,wy,{from:dimStart||dn.snap,free});if(!dimStart){const s=dn.snap||p;if(dragged&&hyp(p.x-s.x,p.y-s.y)>=10)makeDim(s,p);else dimStart=s}else{if(hyp(p.x-dimStart.x,p.y-dimStart.y)>=10)makeDim(dimStart,p);dimStart=null}updDone();req();return}
 if(tool==='text'){askText('Thêm ghi chú','Nội dung chữ','').then(v=>{if(!v)return;const t={id:nid('t'),x:r1(wx),y:r1(wy),text:v,size:textSize};S.texts.push(t);commit();setSel('text',t.id)});return}}
function extendChain(x,y){addWall(chain.x,chain.y,x,y,wallT);const f=chain.pts[0];const closed=chain.pts.length>=3&&hyp(x-f[0],y-f[1])<1;chain.pts.push([x,y]);if(closed){const pts=chain.pts.slice(0,-1);chain=null;if(Math.abs(polyArea(pts))>2e4&&!S.rooms.some(r=>pts.every(p=>onBoundary(p[0],p[1],r,2)))){const r=createRoom(pts,uniqName('Phòng'),{walls:false});commit();setSel('room',r.id);toast('Đã khép kín — tự tạo phòng '+fmtM2(areaM2(r)));return}}else{chain.x=x;chain.y=y}commit()}
function makeRect(a,b){const x1=Math.min(a.x,b.x),y1=Math.min(a.y,b.y),x2=Math.max(a.x,b.x),y2=Math.max(a.y,b.y);const rt=RTYPES[roomOpt.type]||RTYPES[0];const r=createRoom([[x1,y1],[x2,y1],[x2,y2],[x1,y2]],uniqName(rt.n),{t:wallT,walls:roomOpt.walls,color:rt.c,floor:rt.f});commit();setSel('room',r.id);toast(`Đã tạo “${r.name}” ${fmtM2(areaM2(r))}`)}
function finishPoly(){if(poly&&poly.length>=3){const rt=RTYPES[roomOpt.type]||RTYPES[0];const r=createRoom(poly,uniqName(rt.n),{t:wallT,walls:roomOpt.walls,color:rt.c,floor:rt.f});poly=null;commit();setSel('room',r.id)}else poly=null;updDone();req()}
function makeDim(a,b){const d={id:nid('d'),x1:r1(a.x),y1:r1(a.y),x2:r1(b.x),y2:r1(b.y),off:-30};S.dims.push(d);commit();setSel('dim',d.id)}
function finishOps(){if(tool==='wall'&&chain){chain=null}if(poly)finishPoly();rectStart=null;dimStart=null;updDone();renderOpts();req()}
function cancelOps(){chain=null;poly=null;rectStart=null;dimStart=null;calib=null;ghost=null;drag=null;prev=null;guides=[];updDone()}
function updDone(){$('#bDone').hidden=!(chain||poly||rectStart||dimStart)}
$('#bDone').onclick=()=>finishOps();

/* ================= Bàn phím ================= */
window.addEventListener('keydown',e=>{const tg=e.target;if(tg.matches&&tg.matches('input,textarea,select'))return;if(!$('#modal').hidden)return;const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
 if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&k==='y'){e.preventDefault();redo();return}
 if(mod&&k==='d'){e.preventDefault();ACT.dup();return}
 if(mod&&k==='s'){e.preventDefault();saveToBrowser();return}
 if(mod)return;
 if(k===' '){spaceDown=true;cv.style.cursor='grab';e.preventDefault();return}
 if(k==='escape'){if(chain||poly||rectStart||dimStart||calib){cancelOps();renderOpts();req()}else if(sel)setSel(null);else setTool('select');return}
 if(k==='enter'){if(tool==='wall'&&chain&&lenInput()){applyLen();return}finishOps();return}
 if(tool==='wall'&&chain&&/^[0-9.,]$/.test(e.key)){const i=$('#wlen');if(i){i.focus();i.value+=e.key;e.preventDefault()}return}
 if(k==='delete'||k==='backspace'){if(sel){e.preventDefault();ACT.del()}return}
 const T={v:'select',w:'wall',r:'room',d:'door',n:'window',f:'furn',t:'text',m:'dim',b:'bg'};
 if(T[k]){setTool(T[k]);return}
 if(k==='q'||k==='e'){if(sel&&sel.kind==='item'){const o=byId('item',sel.id);o.rot=norm360(o.rot+(k==='e'?1:-1)*(e.shiftKey?90:15));commit()}return}
 if(k.startsWith('arrow')&&sel){const st=e.shiftKey?10:1,dx=k==='arrowleft'?-st:k==='arrowright'?st:0,dy=k==='arrowup'?-st:k==='arrowdown'?st:0;nudge(dx,dy);e.preventDefault();return}
 if(k==='+'||k==='='){zoomAt(1.25,CW/2,CH/2);return}if(k==='-'){zoomAt(.8,CW/2,CH/2);return}if(k==='0'){fit();return}});
window.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;cv.style.cursor=''}});
function nudge(dx,dy){const o=byId(sel.kind,sel.id);if(!o)return;if(sel.kind==='item'||sel.kind==='text'){o.x+=dx;o.y+=dy}else if(sel.kind==='dim'){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else if(sel.kind==='wall'){const r=[...withBase(coincident(o.x1,o.y1)),...withBase(coincident(o.x2,o.y2))];moveRefs(r,dx,dy)}else if(sel.kind==='room'){const out=[];o.pts.forEach(p=>coincident(p[0],p[1]).forEach(r=>{if(!out.some(q=>sameRef(q,r)))out.push(r)}));moveRefs(withBase(out),dx,dy)}commit()}

/* ================= Khung nhìn: fit, resize ================= */
function planBounds(){let pts=[];for(const w of S.walls)pts.push([w.x1-w.t,w.y1-w.t],[w.x2+w.t,w.y2+w.t],[w.x1+w.t,w.y1+w.t],[w.x2-w.t,w.y2-w.t]);for(const r of S.rooms)pts.push(...r.pts);for(const it of S.items){const m=Math.max(it.w,it.d)/2;pts.push([it.x-m,it.y-m],[it.x+m,it.y+m])}for(const t of S.texts){const b=textBox(t);pts.push([b.x1,b.y1],[b.x2,b.y2])}for(const d of S.dims)pts.push(...Object.values(dimPts(d)).filter(Array.isArray));if(BG&&BG.img&&BG.vis)pts.push([BG.x,BG.y],[BG.x+BG.w,BG.y+BG.w*BG.img.naturalHeight/BG.img.naturalWidth]);return pts.length?bbox(pts):null}
function fit(){const b=planBounds();const padT=isMobile()?64:70,pad=40;if(!b){V.z=CW<600?.45:.8;V.ox=CW/2;V.oy=CH/2;req();updStatus();return}const bw=Math.max(100,b.x2-b.x1),bh=Math.max(100,b.y2-b.y1);V.z=clamp(Math.min((CW-2*pad)/bw,(CH-padT-pad-50)/bh),.04,4);V.ox=(CW-bw*V.z)/2-b.x1*V.z;V.oy=padT+(CH-padT-50-bh*V.z)/2-b.y1*V.z;req();updStatus()}
function resize(){const r=$('#stage').getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2.5);const ow=CW,oh=CH;CW=Math.max(1,r.width);CH=Math.max(1,r.height);cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);cv.style.width=CW+'px';cv.style.height=CH+'px';V.ox+=(CW-ow)/2;V.oy+=(CH-oh)/2;req()}
new ResizeObserver(resize).observe($('#stage'));
$('#zIn').onclick=()=>zoomAt(1.3,CW/2,CH/2);$('#zOut').onclick=()=>zoomAt(1/1.3,CW/2,CH/2);$('#zFit').onclick=fit;
function updPos(x,y){$('#sPos').textContent=`x ${(x/100).toFixed(2)}  y ${(y/100).toFixed(2)} m`}
function updStatus(){$('#sZoom').textContent=Math.round(V.z/.8*100)+'%'}

/* ================= Công cụ & thanh tuỳ chọn ================= */
const HINTS={select:'Nhấn để chọn • Kéo để di chuyển • Kéo nền để cuộn • Lăn chuột / 2 ngón để phóng to • Nhấn đúp lên tường để chèn điểm gãy',
 wall:'Nhấn từng điểm để vẽ tường nối tiếp (hoặc kéo) • Nhập độ dài rồi chọn hướng • Esc / nhấn đúp / “Xong” để kết thúc • Khép kín tự tạo phòng • Giữ Alt để tắt bắt điểm',
 room:'Kéo để vẽ phòng chữ nhật (tường tự xây, tường chung tự gộp) • Chế độ đa giác: nhấn từng góc, nhấn lại điểm đầu để khép',
 door:'Nhấn lên tường để đặt cửa • Kéo cửa dọc tường để dời • Nhấn đúp cửa để đổi chiều mở',
 window:'Nhấn lên tường để đặt cửa sổ',
 furn:'Nhấn một món đồ trong thư viện để thêm (hoặc kéo thả vào bản vẽ) • Đồ dựa tường sẽ tự hít sát tường',
 text:'Nhấn vào vị trí để thêm ghi chú',dim:'Nhấn 2 điểm (hoặc kéo) để tạo đường kích thước',
 bg:'Tải ảnh bản vẽ / sơ đồ làm nền để đồ lại • Kéo để dời ảnh • Dùng “Hiệu chỉnh tỉ lệ” để khớp kích thước thật'};
function setTool(t){cancelOps();tool=t;$$('.tool').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));if(!['select','furn','bg'].includes(t))setSel(null);if(t==='furn')openTab('lib',true);$('#sHint').textContent=HINTS[t]||'';renderOpts();renderCtx();updEmpty();cv.style.cursor=t==='select'||t==='furn'?'':'crosshair';req()}
$$('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function chips(list,curv,attr){return list.map(([v,t])=>`<button class="chip${v==curv?' on':''}" data-${attr}="${v}">${t}</button>`).join('')}
function lenInput(){const i=$('#wlen');return i&&i.value.trim()}
function applyLen(dirKey){const raw=lenInput();if(!raw||!chain)return;let v=parseFloat(raw.replace(',','.'));if(!(v>0))return;if(/[.,]/.test(raw)||v<=30)v*=100;let ang;if(dirKey){ang={r:0,d:90,l:180,u:270}[dirKey]*D2R}else if(prev&&hyp(prev.x-chain.x,prev.y-chain.y)>1)ang=Math.atan2(prev.y-chain.y,prev.x-chain.x);else ang=0;extendChain(r1(chain.x+Math.cos(ang)*v),r1(chain.y+Math.sin(ang)*v));renderOpts();updDone();req()}
function renderOpts(){const O=$('#opts');let h='';
 if(tool==='wall'){h=`<span class="olbl">Dày</span>${chips([[10,'10'],[15,'15'],[20,'20'],[25,'25'],[30,'30']],wallT,'wt')}<span class="olbl">cm</span>`;if(chain)h+=`<span class="osep"></span><input class="oin" id="wlen" inputmode="decimal" placeholder="Dài (cm)"><button class="chip" data-dir="r">→</button><button class="chip" data-dir="d">↓</button><button class="chip" data-dir="l">←</button><button class="chip" data-dir="u">↑</button>`}
 else if(tool==='room'){h=`<div class="seg" style="flex:none"><button data-rm="rect" class="${roomOpt.mode==='rect'?'on':''}">▭ Chữ nhật</button><button data-rm="poly" class="${roomOpt.mode==='poly'?'on':''}">⬠ Đa giác</button></div><span class="osep"></span>${RTYPES.map((t,i)=>`<button class="chip${i===roomOpt.type?' on':''}" data-rt="${i}"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${t.c};box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);margin-right:5px"></span>${t.n}</button>`).join('')}<span class="osep"></span><button class="chip${roomOpt.walls?' on':''}" data-rw="1">${roomOpt.walls?'✓ ':''}Xây tường</button><span class="olbl">dày</span>${chips([[10,'10'],[20,'20']],wallT,'wt')}`}
 else if(tool==='door')h=chips(Object.entries(DOORS).map(([k,v])=>[k,`${v.n} <span style="opacity:.6">${v.w}</span>`]),doorType,'dt');
 else if(tool==='window')h=chips(Object.entries(WINS).map(([k,v])=>[k,`${v.n} <span style="opacity:.6">${v.w}</span>`]),winType,'wn');
 else if(tool==='text')h=`<span class="olbl">Cỡ chữ</span>`+chips([[20,'Nhỏ'],[30,'Vừa'],[50,'Lớn'],[80,'Rất lớn']],textSize,'ts');
 else if(tool==='bg'){h=`<button class="chip" data-bg="load">📷 Chọn ảnh</button>`;if(BG)h+=`<span class="olbl">Độ mờ</span><input type="range" min="0.1" max="1" step="0.05" value="${BG.op}" data-bg="op" style="width:90px"><button class="chip${calib?' on':''}" data-bg="calib">📏 Hiệu chỉnh tỉ lệ</button><button class="chip" data-bg="vis">${BG.vis?'Ẩn':'Hiện'}</button><button class="chip" data-bg="lock">${BG.lock?'🔒 Đã khoá':'🔓 Khoá'}</button><button class="chip" data-bg="del">🗑</button>`}
 O.innerHTML=h;
 O.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{wallT=+b.dataset.wt;LS.set('mb_wallT',wallT);renderOpts();req()});
 O.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(!lenInput()){toast('Nhập độ dài trước');$('#wlen').focus();return}applyLen(b.dataset.dir)});
 const wl=$('#wlen');if(wl)wl.onkeydown=e=>{if(e.key==='Enter'){applyLen();e.preventDefault()}if(e.key==='Escape')wl.blur()};
 O.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{roomOpt.mode=b.dataset.rm;LS.set('mb_roomOpt',roomOpt);cancelOps();renderOpts()});
 O.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{roomOpt.type=+b.dataset.rt;LS.set('mb_roomOpt',roomOpt);renderOpts()});
 O.querySelectorAll('[data-rw]').forEach(b=>b.onclick=()=>{roomOpt.walls=!roomOpt.walls;LS.set('mb_roomOpt',roomOpt);renderOpts()});
 O.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{doorType=b.dataset.dt;renderOpts()});
 O.querySelectorAll('[data-wn]').forEach(b=>b.onclick=()=>{winType=b.dataset.wn;renderOpts()});
 O.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{textSize=+b.dataset.ts;renderOpts()});
 O.querySelectorAll('[data-bg]').forEach(b=>{const a=b.dataset.bg;if(a==='op'){b.oninput=()=>{BG.op=+b.value;req()};b.onchange=saveBG;return}b.onclick=()=>{if(a==='load')$('#fImg').click();if(a==='calib'){calib=calib?null:[];if(calib)toast('Nhấn 2 điểm trên ảnh có khoảng cách đã biết');renderOpts()}if(a==='vis'){BG.vis=!BG.vis;saveBG();renderOpts();req()}if(a==='lock'){BG.lock=!BG.lock;saveBG();renderOpts()}if(a==='del'){BG=null;saveBG();renderOpts();refresh()}}})}
async function finishCalib(){const [a,b]=calib;const dpx=hyp(b[0]-a[0],b[1]-a[1]);calib=null;renderOpts();const v=await askText('Hiệu chỉnh tỉ lệ',`Khoảng cách thật giữa 2 điểm (cm). Hiện tại đo được ${r1(dpx)} cm`,String(r1(dpx)),'number');const real=parseFloat(v);if(!(real>0)||dpx<1){req();return}const f=real/dpx;BG.x=a[0]+(BG.x-a[0])*f;BG.y=a[1]+(BG.y-a[1])*f;BG.w*=f;saveBG();toast('Đã chỉnh tỉ lệ ảnh nền');req()}
$('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;downscale(f,2400,.85).then(src=>{const img=new Image();img.onload=()=>{const [cx,cy]=s2w(CW/2,CH/2);const w=1000;BG={src,img,x:cx-w/2,y:cy-w*img.naturalHeight/img.naturalWidth/2,w,op:.5,vis:true,lock:false};saveBG();renderOpts();refresh();toast('Đã tải ảnh nền. Dùng “Hiệu chỉnh tỉ lệ” để khớp kích thước thật.',3500)};img.src=src})};
function downscale(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));if(s===1&&file.size<1.5e6){res(fr.result);return}const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ================= Hành động (dùng chung thanh ngữ cảnh + bảng thuộc tính) ================= */
const selObj=()=>sel&&byId(sel.kind,sel.id);
const ACT={
 del(){if(!sel)return;if(sel.kind==='room'){ACT.delRoomAll();return}deleteObj(sel.kind,sel.id);sel=null;commit()},
 delFloor(){if(!sel)return;deleteObj(sel.kind,sel.id);sel=null;commit();toast('Đã xoá sàn & tên phòng, giữ lại tường')},
 rotRoomR(){const o=selObj();if(!o||sel.kind!=='room'){toast('Chọn một phòng trước');return}rotateRoom(o,90);commit()},
 rotRoomL(){const o=selObj();if(!o||sel.kind!=='room')return;rotateRoom(o,-90);commit()},
 rotRoomBy(){const o=selObj();const v=parseFloat(($('#rrDeg')||{}).value);if(!o||!isFinite(v)||!v)return;rotateRoom(o,v);commit()},
 autoFurnish(){const o=selObj();if(!o||sel.kind!=='room'){toast('Chọn một phòng trước');return}const n=furnishRoom(o);commit();toast(n?`Đã tự bố trí ${n} món cho “${o.name}”`:'Phòng quá nhỏ hoặc không còn chỗ trống')},
 dup(){const o=selObj();if(!o)return;if(sel.kind==='item'){const n={...o,id:nid('i'),x:o.x+30,y:o.y+30};S.items.push(n);commit();setSel('item',n.id)}else if(sel.kind==='text'){const n={...o,id:nid('t'),x:o.x+30,y:o.y+30};S.texts.push(n);commit();setSel('text',n.id)}else if(sel.kind==='room'){const b=bbox(o.pts),dx=b.x2-b.x1;const r=createRoom(o.pts.map(p=>[p[0]+dx,p[1]]),uniqName(o.name.replace(/\s\d+$/,'')),{t:wallT,color:o.color,floor:o.floor});commit();setSel('room',r.id)}},
 rotR(){const o=selObj();if(o&&sel.kind==='item'){o.rot=norm360(o.rot+90);commit()}},
 rotL(){const o=selObj();if(o&&sel.kind==='item'){o.rot=norm360(o.rot-90);commit()}},
 front(){const o=selObj();if(!o)return;S.items=S.items.filter(i=>i!==o);S.items.push(o);commit()},
 back(){const o=selObj();if(!o)return;S.items=S.items.filter(i=>i!==o);S.items.unshift(o);commit()},
 snapwall(){const o=selObj();if(o&&magnet(o,150))commit();else toast('Không có tường gần để áp (hoặc đồ này không dựa tường)')},
 split(){const o=selObj();if(o&&splitWall(o,wlen(o)/2))commit()},
 addDoor(){const o=selObj();if(!o)return;const [ux,uy]=wdir(o),L=wlen(o);const op=placeOpening('door','single',o.x1+ux*L/2,o.y1+uy*L/2,0,5);if(op){commit();setSel('opening',op.id)}},
 addWin(){const o=selObj();if(!o)return;const [ux,uy]=wdir(o),L=wlen(o);const op=placeOpening('window','win',o.x1+ux*L/2,o.y1+uy*L/2,0,5);if(op){commit();setSel('opening',op.id)}},
 flip(){const o=selObj();if(o){o.flip=!o.flip;commit()}},
 swing(){const o=selObj();if(o){o.side=!o.side;commit()}},
 async rename(){const o=selObj();if(!o||sel.kind!=='room')return;const v=await askText('Đổi tên phòng','Tên phòng',o.name);if(v&&v.trim()){o.name=v.trim();commit()}},

function setField(o,f,v){const k=sel.kind;const n=parseFloat(v);
 if(['label','name','text','color'].includes(f)){o[f]=v;return}
 if(!isFinite(n))return;
 if(k==='wall'&&f==='len'){if(n<5)return;const [ux,uy]=wdir(o);const refs=coincident(o.x2,o.y2);setRefs(refs,r1(o.x1+ux*n),r1(o.y1+uy*n));S.walls.forEach(clampOpenings);return}
 if(k==='wall'&&f==='t'){o.t=clamp(n,2,100);return}
 if(k==='opening'&&f==='w'){const g=og(o);o.w=clamp(n,20,g?g.L-4:n);if(g)clampOpenings(g.w);return}
 if(k==='opening'&&f==='pos2'){const g=og(o);if(g)o.pos=clamp(n+o.w/2,o.w/2,g.L-o.w/2);return}
 if(k==='item'&&(f==='w'||f==='d')){o[f]=Math.max(5,n);return}
 if(f==='rot'){o.rot=norm360(n);return}
 o[f]=n}

/* ================= Lưu / mở ================= */
async function newPlan(){if((S.walls.length||S.items.length)&&!await confirmBox('Tạo mặt bằng mới? Hãy lưu bản hiện tại nếu cần.'))return;S=blank();BG=null;saveBG();sel=null;$('#pname').value=S.name;cancelOps();histReset();autosave();refresh();fit()}
function saveToBrowser(){if(!S.pid)S.pid='p'+Date.now().toString(36);const P=LS.get('mb_projects',{});P[S.pid]={n:S.name||'Không tên',t:Date.now(),d:S};if(LS.set('mb_projects',P)){autosave();toast('Đã lưu “'+(S.name||'Không tên')+'” vào trình duyệt')}else toast('Bộ nhớ trình duyệt đầy — hãy tải file .json')}
function projectsModal(){const P=LS.get('mb_projects',{});const list=Object.entries(P).sort((a,b)=>b[1].t-a[1].t);const m=modal(`<h3>Dự án đã lưu</h3><div class="row wrap"><button class="btn pri" id="pmSave">💾 Lưu bản hiện tại</button><button class="btn" id="pmOpen">⬆ Mở file .json</button></div><div class="plist">${list.map(([id,p])=>`<div class="pi"><div><b>${esc(p.n)}</b><span class="muted">${new Date(p.t).toLocaleString('vi-VN')} • ${(p.d.rooms||[]).length} phòng</span></div><button class="btn sm" data-open="${id}">Mở</button><button class="btn sm danger" data-del="${id}">Xoá</button></div>`).join('')||'<p class="muted">Chưa có dự án nào được lưu.</p>'}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="pmClose">Đóng</button></div>`);
 $('#pmClose').onclick=closeModal;$('#pmSave').onclick=()=>{saveToBrowser();projectsModal()};$('#pmOpen').onclick=()=>{closeModal();$('#fJson').click()};
 m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S=JSON.parse(JSON.stringify(P[b.dataset.open].d));sel=null;$('#pname').value=S.name||'';cancelOps();histReset();autosave();refresh();fit();closeModal();toast('Đã mở “'+S.name+'”')});
 m.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const n=P[b.dataset.del].n;delete P[b.dataset.del];LS.set('mb_projects',P);projectsModal();toast('Đã xoá “'+n+'”')})}
function dl(name,href){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100)}
const fname=ext=>(S.name||'mat-bang').replace(/[\\/:*?"<>|]+/g,'').trim()+'.'+ext;
function downloadJSON(){const data={app:'ve-mat-bang-2d',v:1,S,ulib:usedUlib(),bg:BG?{src:BG.src,x:BG.x,y:BG.y,w:BG.w,op:BG.op,vis:BG.vis,lock:BG.lock}:null};dl(fname('json'),URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})))}
$('#fJson').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);const s=j.S||j;if(!Array.isArray(s.walls))throw 0;if(j.ulib)mergeUlib(j.ulib);S=Object.assign(blank(),s);sel=null;$('#pname').value=S.name||'';if(j.bg&&j.bg.src){const img=new Image();img.onload=()=>{BG={...j.bg,img};saveBG();refresh()};img.src=j.bg.src}cancelOps();histReset();autosave();refresh();fit();toast('Đã mở file')}catch(err){toast('File không hợp lệ')}};fr.readAsText(f)};
function exportCanvas(){const b=planBounds();if(!b)return null;const pad=60,W=b.x2-b.x1+2*pad,Hh=b.y2-b.y1+2*pad;const sc=Math.min(4,3600/Math.max(W,Hh));const top=Math.round(80*clamp(sc/1.1,1,4)),bot=Math.round(50*clamp(sc/1.1,1,4));const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(Hh*sc)+top+bot;render(c.getContext('2d'),c.width,c.height,{z:sc,ox:-(b.x1-pad)*sc,oy:-(b.y1-pad)*sc+top},1,{export:true,title:S.name});return c}
function exportPNG(){const c=exportCanvas();if(!c){toast('Bản vẽ đang trống');return}c.toBlob(b=>dl(fname('png'),URL.createObjectURL(b)),'image/png');toast('Đang tải ảnh PNG…')}
function printPlan(){const c=exportCanvas();if(!c){toast('Bản vẽ đang trống');return}const w=window.open('','_blank');if(!w){toast('Trình duyệt chặn cửa sổ in — hãy dùng Ảnh PNG');return}w.document.write(`<title>${esc(S.name)}</title><style>body{margin:0}img{width:100%;}@page{margin:10mm}</style><img src="${c.toDataURL('image/png')}" onload="setTimeout(()=>print(),200)">`);w.document.close()}
function planMD(){const lines=[`# ${S.name||'Mặt bằng'}`,'',`Đơn vị: cm. Toạ độ x sang phải, y xuống dưới. Tổng diện tích sàn: ${fmtM2(S.rooms.reduce((s,r)=>s+areaM2(r),0))}.`,'','## Phòng','','| Phòng | Vị trí (x,y) | Kích thước bao | Diện tích |','|---|---|---|---|'];
 for(const r of S.rooms){const b=bbox(r.pts);lines.push(`| ${r.name} | ${r1(b.x1)}, ${r1(b.y1)} | ${r1(b.x2-b.x1)} × ${r1(b.y2-b.y1)} | ${fmtM2(areaM2(r))} |`)}
 lines.push('','## Cửa đi & cửa sổ','');for(const o of S.openings){const g=og(o);if(!g)continue;const a=roomAt(g.cx+g.nx*(g.t/2+30),g.cy+g.ny*(g.t/2+30)),b=roomAt(g.cx-g.nx*(g.t/2+30),g.cy-g.ny*(g.t/2+30));lines.push(`- ${(o.kind==='door'?DOORS:WINS)[o.type].n} rộng ${r1(o.w)} — giữa ${a?a.name:'bên ngoài'} và ${b?b.name:'bên ngoài'} (tại ${r1(g.cx)}, ${r1(g.cy)})`)}
 lines.push('','## Nội thất','');const grp={};for(const it of S.items){const r=roomAt(it.x,it.y);const k=r?r.name:'Ngoài phòng';(grp[k]=grp[k]||[]).push(`${it.label||(FURN[it.type]||FURN.box).n} ${r1(it.w)}×${r1(it.d)}`)}for(const k in grp)lines.push(`- **${k}**: ${grp[k].join(', ')}`);
 return lines.join('\n')}
function mdModal(){const md=planMD();modal(`<h3>Mô tả Markdown</h3><textarea class="inp" rows="14" id="mdT" style="font:12px ui-monospace,monospace">${esc(md)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="mdDl">⬇ Tải .md</button><button class="btn pri" id="mdCp">Sao chép</button></div>`);$('#mdCp').onclick=()=>{const t=$('#mdT');t.select();(navigator.clipboard?navigator.clipboard.writeText(md):Promise.reject()).then(()=>toast('Đã sao chép')).catch(()=>{document.execCommand('copy');toast('Đã sao chép')})};$('#mdDl').onclick=()=>dl(fname('md'),URL.createObjectURL(new Blob([md],{type:'text/markdown'})))}

/* ================= Áp dụng thao tác (dùng cho AI + mẫu) ================= */
function numv(v,d){const n=parseFloat(v);return isFinite(n)?n:d}
function doAction(a){if(!a||typeof a!=='object')return false;const act=String(a.action||a.type_action||'').toLowerCase();
 switch(act){
  case 'clear':S=Object.assign(blank(),{name:S.name,pid:S.pid,seq:S.seq,fl:S.fl,cf:S.cf,sync:S.sync});return true;
  case 'outline':{const x=numv(a.x,0),y=numv(a.y,0),w=numv(a.w,0),h=numv(a.h,0),t=numv(a.t,20);if(w<10||h<10)throw new Error('kích thước không hợp lệ');[[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]].forEach(e=>addWallDedupe(...e,t));return true}
  case 'add_room':{let pts=a.points||a.pts;if(!Array.isArray(pts)){const x=numv(a.x,0),y=numv(a.y,0),w=numv(a.w,0),h=numv(a.h,0);if(w<10||h<10)throw new Error('phòng quá nhỏ');pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}if(pts.length<3)throw new Error('cần ≥3 điểm');createRoom(pts.map(p=>Array.isArray(p)?p:[p.x,p.y]),a.name||uniqName('Phòng'),{t:numv(a.t,10),walls:a.walls!==false,color:a.color,floor:a.floor});return true}
  case 'add_wall':{addWallDedupe(numv(a.x1),numv(a.y1),numv(a.x2),numv(a.y2),numv(a.t,10));return true}
  case 'add_door':case 'add_window':{const kind=act==='add_door'?'door':'window';let x=numv(a.x,null),y=numv(a.y,null);if((x==null||y==null)&&a.room){const r=S.rooms.find(r=>r.name===a.room||r.id===a.room);if(!r)throw new Error('không thấy phòng '+a.room);const b=bbox(r.pts),side=String(a.side||'bottom'),off=numv(a.offset,null);if(side==='top'||side==='bottom'){y=side==='top'?b.y1:b.y2;x=off!=null?b.x1+off:(b.x1+b.x2)/2}else{x=side==='left'?b.x1:b.x2;y=off!=null?b.y1+off:(b.y1+b.y2)/2}}if(x==null||y==null)throw new Error('thiếu toạ độ');const o=placeOpening(kind,a.type||a.style||(kind==='door'?'single':'win'),x,y,numv(a.w||a.width,0),60);if(!o)throw new Error('không có tường gần ('+r1(x)+','+r1(y)+')');if(a.flip)o.flip=true;if(a.swing==='reverse')o.side=!o.side;return true}
  case 'add_furniture':case 'add_item':{const type=resolveType(a.type);let x=numv(a.x,null),y=numv(a.y,null);if((x==null||y==null)){const r=a.room&&S.rooms.find(r=>r.name===a.room||r.id===a.room);if(!r)throw new Error('thiếu toạ độ cho '+a.type);[x,y]=centroid(r.pts)}const it=addItem(type,x,y,{rot:numv(a.rot??a.rotation,0),w:numv(a.w,0),d:numv(a.d,0),label:a.label,color:a.color,origType:a.type});if(a.snap!==false)magnet(it,60);return true}
  case 'update':case 'move':{const f=findAny(a.id);if(!f)throw new Error('không thấy id '+a.id);const p=a.props||a;const o=f.o;for(const k of ['x','y','w','d','rot','t','pos','size','x1','y1','x2','y2'])if(p[k]!=null&&isFinite(+p[k]))o[k]=+p[k];for(const k of ['name','label','color','floor','text','type'])if(p[k]!=null)o[k]=f.kind==='item'&&k==='type'?resolveType(p[k]):p[k];if(f.kind==='item'&&p.rotation!=null)o.rot=norm360(+p.rotation);if(f.kind==='room'&&Array.isArray(p.points))o.pts=p.points;return true}
  case 'rename_room':{const r=S.rooms.find(r=>r.name===a.name||r.id===a.id);if(!r)throw new Error('không thấy phòng');r.name=a.new_name||a.to;return true}
  case 'delete':case 'remove':{const f=findAny(a.id);if(!f)throw new Error('không thấy id '+a.id);if(f.kind==='room'&&a.with_walls)deleteRoomAll(f.o);else deleteObj(f.kind,a.id);return true}
  case 'add_text':{S.texts.push({id:nid('t'),x:numv(a.x,0),y:numv(a.y,0),text:String(a.text||''),size:numv(a.size,30)});return true}
  case 'add_dimension':{S.dims.push({id:nid('d'),x1:numv(a.x1),y1:numv(a.y1),x2:numv(a.x2),y2:numv(a.y2),off:numv(a.off,-30)});return true}
  case 'rename':case 'set_name':{S.name=String(a.name||S.name);$('#pname').value=S.name;return true}
  case 'rotate_room':{const r=findRoom(a.room||a.name||a.id);if(!r)throw new Error('không thấy phòng '+(a.room||''));rotateRoom(r,numv(a.angle,90));if(a.relayout||a.rearrange)furnishRoom(r);return true}
  case 'rotate_all':{rotateAll(numv(a.angle,90));return true}
  case 'move_room':{const r=findRoom(a.room||a.name||a.id);if(!r)throw new Error('không thấy phòng '+(a.room||''));moveRoom(r,numv(a.dx,0),numv(a.dy,0));return true}
  case 'delete_room':{const r=findRoom(a.room||a.name||a.id);if(!r)throw new Error('không thấy phòng '+(a.room||''));deleteRoomAll(r);return true}
  case 'furnish_room':{const list=(!a.room||a.room==='*')?S.rooms:[findRoom(a.room)].filter(Boolean);if(!list.length)throw new Error('không thấy phòng '+a.room);list.forEach(r=>furnishRoom(r));return true}
  case 'tidy':case 'auto_fix':{autoFix({tol:numv(a.tol,8)});return true}
  case 'add_door_between':{const r=findRoom(a.room||a.a),r2=findRoom(a.room2||a.b);if(!r)throw new Error('không thấy phòng');const od=addDoorFor(r,r2,'door');if(od&&od.none)throw new Error('2 phòng không có tường chung');if(!od)throw new Error('không còn chỗ đặt cửa');return true}
  default:throw new Error('không hiểu lệnh "'+act+'"')}}
function applyActions(acts){let n=0;const errs=[];const hadAny=S.walls.length;let cleared=false;for(const a of acts||[]){try{if(doAction(a)){n++;if(String(a.action).toLowerCase()==='clear')cleared=true}}catch(e){errs.push(e.message)}}sel=null;commit();if(cleared||!hadAny)fit();return {n,errs}}

HỆ TOẠ ĐỘ: đơn vị cm; x tăng sang PHẢI, y tăng xuống DƯỚI. Mặc định phía dưới (y lớn) là mặt tiền / đường.
ĐỊNH DẠNG BẮT BUỘC: chỉ trả về MỘT đối tượng JSON hợp lệ, không có chữ nào khác:
{"message":"lời giải thích ngắn gọn cho người dùng","actions":[ ... ]}
Nếu người dùng chỉ hỏi, nhờ nhận xét, tư vấn phong thuỷ... thì "actions": [] và viết nội dung vào "message" (có thể dài, xuống dòng bằng \\n).
CÁC LỆNH (action):
- {"action":"clear"} xoá sạch bản vẽ (chỉ dùng khi được yêu cầu tạo mặt bằng MỚI).
- {"action":"outline","x":0,"y":0,"w":500,"h":2000,"t":20} xây tường bao hình chữ nhật dày 20.
- {"action":"add_room","name":"Phòng ngủ 1","x":0,"y":0,"w":400,"h":350,"t":10,"walls":true} phòng chữ nhật (x,y là góc trên-trái, tính theo TIM tường). "walls":false = chỉ vẽ sàn/tên, không xây tường (dùng cho không gian mở như khách+bếp liền nhau). Tường trùng tường có sẵn tự bỏ qua, nên các phòng kề nhau cứ dùng chung cạnh.
- {"action":"add_room","name":"...","points":[[x,y],[x,y],...],"t":10} phòng đa giác.
- {"action":"add_wall","x1":..,"y1":..,"x2":..,"y2":..,"t":10}
- {"action":"add_door","x":..,"y":..,"w":80,"type":"single|main|double|sliding|open|garage"} (x,y) là một điểm NẰM TRÊN TIM tường; cửa tự gắn vào tường gần nhất và tự mở vào phía phòng nhỏ hơn. Có thể dùng {"action":"add_door","room":"WC","side":"top|bottom|left|right","offset":75} (offset tính từ góc trái/trên của cạnh phòng).
- {"action":"add_window","x":..,"y":..,"w":120,"type":"win|win2|glass|small"} cửa sổ chỉ đặt trên tường bao.
- {"action":"add_furniture","type":"<mã>","x":..,"y":..,"rot":0,"w":(tuỳ chọn),"d":(tuỳ chọn),"label":(tuỳ chọn)} (x,y) là TÂM đồ vật. rot tính bằng độ: 0 = lưng (đầu giường, lưng sofa, mặt sau tủ) dựa tường phía TRÊN; 90 = dựa tường bên PHẢI; 180 = dựa tường phía DƯỚI; 270 = dựa tường bên TRÁI. Với rot 90/270 thì chiều rộng w nằm theo trục y. Đồ có dấu * tự hít sát tường gần nhất (trong 60cm). Có thể thay x,y bằng "room":"tên phòng" để đặt giữa phòng.
- {"action":"update","id":"i12","props":{"x":..,"y":..,"rot":..,"w":..,"d":..,"name":..,"label":..}} sửa đối tượng có sẵn theo id.
- {"action":"delete","id":"..."} xoá theo id (phòng: thêm "with_walls":true để xoá cả tường và đồ bên trong).
- {"action":"add_text","x":..,"y":..,"text":"...","size":30}
- {"action":"rotate_room","room":"Phòng ngủ 1","angle":90,"relayout":true} xoay NGUYÊN phòng (sàn, tường riêng, cửa, đồ đạc) quanh tâm phòng; angle dương = cùng chiều kim đồng hồ; relayout=true để tự bố trí lại nội thất sau khi xoay.
- {"action":"rotate_all","angle":90} xoay toàn bộ mặt bằng.
- {"action":"move_room","room":"...","dx":100,"dy":0} dời nguyên phòng.
- {"action":"delete_room","room":"..."} xoá nguyên phòng (sàn, tường riêng, cửa, đồ bên trong).
- {"action":"furnish_room","room":"..."} tự bố trí nội thất cơ bản theo loại phòng ("*" = mọi phòng); có thể dùng trước rồi thêm/sửa bằng add_furniture, update.
- {"action":"add_door_between","room":"Bếp","room2":"Phòng khách"} thêm cửa trên tường chung của 2 phòng (bỏ room2 = tự chọn tường phù hợp).
- {"action":"tidy"} tự chỉnh bản vẽ: làm thẳng tường bị xéo, nối điểm lệch vài cm, gộp tường trùng.
MÃ NỘI THẤT (mã=tên rộng x sâu cm, * = dựa tường): ${cat}
QUY TẮC THIẾT KẾ: tường bao dày 20 (dùng outline), tường ngăn dày 10. Mặt trong tường bao lệch 10cm so với tim. Cửa đi 70-90 (WC 70), cửa chính 90-120. Mỗi phòng phải có cửa đi vào được. Đồ đạc nằm trọn trong phòng, không chồng lên nhau, không chắn đường mở cửa, chừa lối đi ≥ 70cm. Phòng ngủ tối thiểu ~9m², WC tối thiểu 1,2x1,8m. Kích thước thực tế Việt Nam (nhà phố thường rộng 4-6m). Nếu tạo mặt bằng mới: dùng clear → outline → add_room → add_door/add_window → add_furniture.
MẶT BẰNG HIỆN TẠI (JSON): ${planCtx()}`}

 $('#b3h').onchange=e=>{const v=clamp(parseFloat(e.target.value)||300,150,800);S.walls.forEach(w=>w.h=v);if(S.fl.length>1)curFl().h=v;commit();toast('Đã đặt chiều cao '+v+' cm cho tất cả tường')};
 $('#b3url').onchange=e=>{B3.url=e.target.value.trim()||'http://localhost:8765';b3save();blPing()};

 $('#b3py').onclick=()=>{if(!S.fl.some(f=>{const d=flData(f);return d.walls.length||d.rooms.length})){toast('Bản vẽ đang trống');return}dlText(fname('py'),makeScript())};
 $('#b3ping').onclick=()=>{b3stat('<span class="spin"></span>Đang kiểm tra…');blPing()};

 if(b3busy)b3stat(`<span class="spin"></span>Blender đang xử lý…`);else blPing(true).then(ok=>{if(!ok)b3stat('Chưa kết nối — làm theo 3 bước ở trên.','muted')});

/* ================= Nhiều tầng (hầm / trệt / lầu) ================= */
const CORE_T=new Set(['stairs','elevator']);
const OUTDOOR_RE=/(^| )(san|vuon|ho boi|bai|garden|ho ca)( |$)/;
const FKEYS=['walls','openings','rooms','items','texts','dims'];
const flName=lv=>lv<0?(lv===-1?'Tầng hầm':'Hầm '+(-lv)):lv===0?'Tầng trệt':'Lầu '+lv;
Object.assign(ALIAS,{"thang máy":"elevator","thang may":"elevator","lift":"elevator","elevator":"elevator","thang bộ":"stairs","cầu thang":"stairs"});
if(PREF.ghost===undefined)PREF.ghost=true;
function normFloors(){
 if(!Array.isArray(S.fl)||!S.fl.length){S.fl=[{id:'f0',name:'Tầng trệt',lv:0,h:300,data:null}];S.cf='f0'}
 if(!S.fl.some(f=>f.id===S.cf))S.cf=S.fl[0].id;
 for(const f of S.fl){if(f.id===S.cf)f.data=null;else if(!f.data)f.data={walls:[],openings:[],rooms:[],items:[],texts:[],dims:[]}}
 if(S.sync===undefined)S.sync=true}
const curFl=()=>S.fl.find(f=>f.id===S.cf);
const flSorted=()=>[...S.fl].sort((a,b)=>a.lv-b.lv);
const flData=f=>f.id===S.cf?{walls:S.walls,openings:S.openings,rooms:S.rooms,items:S.items,texts:S.texts,dims:S.dims}:f.data;
const allItems=()=>{normFloors();return S.fl.flatMap(f=>flData(f).items)};
const clone=o=>JSON.parse(JSON.stringify(o));
function stLbl(){if(!S.fl||S.fl.length<2)return 'LÊN';const s=flSorted(),i=s.findIndex(f=>f.id===S.cf);const up=i<s.length-1,down=i>0;return up&&down?'LÊN/XUỐNG':down?'XUỐNG':'LÊN'}

/* --- nhận diện khung ngoài & vùng thang --- */
function detectExt(){
 const ind=S.rooms.filter(r=>r.pts.length>2&&!OUTDOOR_RE.test(norm(r.name)));const res=[];
 if(ind.length){
  for(const w of S.walls){if(wlen(w)<30)continue;const [ux,uy]=wdir(w),nx=-uy,ny=ux,o=w.t/2+10;let sc=0;
   for(const f of [.25,.5,.75]){const px=w.x1+(w.x2-w.x1)*f,py=w.y1+(w.y2-w.y1)*f;const a=ind.some(r=>pip(px+nx*o,py+ny*o,r.pts)),b=ind.some(r=>pip(px-nx*o,py-ny*o,r.pts));if(a!==b)sc++}
   if(sc>=2)res.push(w)}
 }else if(S.walls.length){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;for(const w of S.walls){x1=Math.min(x1,w.x1,w.x2);y1=Math.min(y1,w.y1,w.y2);x2=Math.max(x2,w.x1,w.x2);y2=Math.max(y2,w.y1,w.y2)}
  for(const w of S.walls){const e=w.t+4;const hor=Math.abs(w.y1-w.y2)<3,ver=Math.abs(w.x1-w.x2)<3;
   if((hor&&(Math.abs(w.y1-y1)<e||Math.abs(w.y1-y2)<e))||(ver&&(Math.abs(w.x1-x1)<e||Math.abs(w.x1-x2)<e)))res.push(w)}}
 return res}
function wallsOnRoom(r){return S.walls.filter(w=>[[w.x1,w.y1],[w.x2,w.y2],[(w.x1+w.x2)/2,(w.y1+w.y2)/2]].every(p=>onBoundary(p[0],p[1],r,12)))}
function markFrame(){if(S.walls.some(w=>w.sy))return 0;const ws=detectExt();ws.forEach(w=>{if(w.sy===undefined)w.sy=1});return ws.length}
function markCoreZones(){let n=0;
 for(const it of S.items){if(!CORE_T.has(it.type)&&it.sy!==0&&/(^| )(thang may|elevator|lift)( |$)/.test(norm(it.label||''))){it.type='elevator';it.color='#dde2e6';delete it.label}}
 for(const it of S.items){if(!CORE_T.has(it.type)||it.sy===0)continue;it.sy=1;
  const rs=S.rooms.filter(r=>r.pts.length>2&&pip(it.x,it.y,r.pts)).sort((a,b)=>areaM2(a)-areaM2(b));
  const r=rs.find(r=>!OUTDOOR_RE.test(norm(r.name)));
  if(r&&(areaM2(r)<=2.2*(it.w*it.d/1e4)||/thang/.test(norm(r.name)))){if(r.sy===undefined){r.sy=1;n++}wallsOnRoom(r).forEach(w=>{if(w.sy===undefined)w.sy=1})}
  else if(!S.rooms.some(q=>q.sy&&q.zone===it.id)){
   const m=30,c=Math.cos(it.rot*D2R),s=Math.sin(it.rot*D2R),hw=it.w/2+m,hd=it.d/2+m;
   const pts=[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([lx,ly])=>[r1(it.x+lx*c-ly*s),r1(it.y+lx*s+ly*c)]);
   S.rooms.push({id:nid('r'),name:it.type==='elevator'?'Giếng thang':'Lồng thang',pts,color:'#e8e1d6',floor:'tile',sy:1,zone:it.id});n++}}
 return n}

/* --- đồng bộ: khung ngoài + thang bộ + thang máy giữ nguyên ở mọi tầng --- */
function syncCore(){
 normFloors();if(S.fl.length<2||S.sync===false)return;
 for(const it of S.items)if(CORE_T.has(it.type)&&it.sy===undefined)it.sy=1;
 for(const r of S.rooms)if(r.sy===undefined&&/thang/.test(norm(r.name)))r.sy=1;
 const src={walls:S.walls.filter(x=>x.sy),rooms:S.rooms.filter(x=>x.sy),items:S.items.filter(x=>x.sy)};
 for(const f of S.fl){if(f.id===S.cf)continue;const d=f.data;
  for(const k of ['walls','rooms','items'])d[k]=d[k].filter(x=>!x.sy).concat(src[k].map(clone));
  const wid=new Set(d.walls.map(w=>w.id));d.openings=d.openings.filter(o=>wid.has(o.wall))}}

/* --- chuyển / thêm / xoá tầng --- */
function stashCur(){const c=curFl();c.data={walls:S.walls,openings:S.openings,rooms:S.rooms,items:S.items,texts:S.texts,dims:S.dims}}
function switchFloor(id,quiet){normFloors();if(id===S.cf)return;const t=S.fl.find(f=>f.id===id);if(!t)return;stashCur();
 for(const k of FKEYS)S[k]=t.data[k]||[];t.data=null;S.cf=id;sel=null;cancelOps();commit();if(!quiet)toast('Đang ở: '+t.name+(t.lv!==0?'':' (mặt đất)'))}
function newFloorId(){return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function addFloor(dir,mode){normFloors();const sorted=flSorted();
 const lv=dir>0?sorted[sorted.length-1].lv+1:sorted[0].lv-1;
 const src=S.fl.find(f=>f.lv===(dir>0?lv-1:(lv===-1?0:lv+1)))||curFl();
 if(src.id!==S.cf)switchFloor(src.id,true);
 let nFrame=0,nCore=0;
 if(mode!=='empty'){nFrame=markFrame();nCore=markCoreZones()}
 const data={walls:[],openings:[],rooms:[],items:[],texts:[],dims:[]};
 if(mode==='full'){for(const k of FKEYS)data[k]=clone(S[k])}
 else if(mode==='core'){
  data.walls=S.walls.filter(w=>w.sy).map(clone);data.rooms=S.rooms.filter(r=>r.sy).map(clone);data.items=S.items.filter(i=>i.sy).map(clone);
  const wid=new Set(data.walls.map(w=>w.id));
  data.openings=S.openings.filter(o=>wid.has(o.wall)&&o.type!=='main'&&o.type!=='garage'&&!(lv<0&&o.kind==='window')).map(o=>Object.assign(clone(o),{id:nid('o')}))}
 const f={id:newFloorId(),name:flName(lv),lv,h:src.h||300,data};S.fl.push(f);
 switchFloor(f.id,true);fit();
 toast(mode==='empty'?'Đã tạo '+f.name+' (trống)':mode==='full'?'Đã nhân bản '+src.name+' thành '+f.name:`Đã tạo ${f.name}: giữ nguyên khung ngoài (${data.walls.length} tường) và ${data.items.length} thang`,3800)}
async function delFloor(id){normFloors();if(S.fl.length<2){toast('Phải còn ít nhất một tầng');return}const f=S.fl.find(x=>x.id===id);if(!await confirmBox('Xoá “'+f.name+'” cùng toàn bộ bản vẽ của tầng này?'))return;
 if(id===S.cf){const s=flSorted(),i=s.findIndex(x=>x.id===id);switchFloor((s[i-1]||s[i+1]).id,true)}
 S.fl=S.fl.filter(x=>x.id!==id);commit();toast('Đã xoá '+f.name)}
async function renameFloor(f){const v=await askText('Tên tầng','Tên hiển thị',f.name);if(v==null||!v.trim())return;f.name=v.trim().slice(0,24);commit()}
async function heightFloor(f){const v=await askText('Chiều cao tầng','Cao từ sàn đến sàn tầng trên (cm)',String(f.h||300),'number');if(v==null)return;const n=clamp(parseFloat(v)||300,200,600);const old=f.h||300;f.h=n;
 const d=flData(f);d.walls.forEach(w=>{if(!w.h||w.h===old)w.h=n});commit()}

/* --- thanh chọn tầng --- */
function renderFloors(){const el=$('#floors');if(!el)return;normFloors();const fl=flSorted().reverse();
 el.innerHTML=`<button class="fb add" data-fa="1">＋ Lầu</button>`+fl.map(f=>`<button class="fb${f.id===S.cf?' on':''}" data-f="${f.id}" title="${esc(f.name)} — cao ${f.h||300} cm">${esc(f.name)}${f.id===S.cf?' ▾':''}</button>`).join('')+`<button class="fb add" data-fa="-1">＋ Hầm</button>`;
 el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(b.dataset.f!==S.cf){switchFloor(b.dataset.f);return}floorMenu(b)});
 el.querySelectorAll('[data-fa]').forEach(b=>b.onclick=()=>{const dir=+b.dataset.fa,nm=dir>0?'lầu':'tầng hầm';
  showMenu(b,[{t:'Thêm '+nm+' — giữ khung ngoài + thang',sub:'Tường bao, cầu thang, thang máy lấy từ tầng kề bên',ic:'🏗',fn:()=>addFloor(dir,'core')},
   {t:'Nhân bản nguyên '+(dir>0?'tầng trên cùng':'tầng trệt'),sub:'Sao chép cả phòng, đồ đạc để sửa tiếp',ic:'⧉',fn:()=>addFloor(dir,'full')},
   {t:'Thêm '+nm+' trống',sub:'Không sao chép gì',ic:'▭',fn:()=>addFloor(dir,'empty')}])})}
function floorMenu(btn){const f=curFl();
 showMenu(btn,[{t:'Đổi tên tầng',ic:'✏',fn:()=>renameFloor(f)},
  {t:'Chiều cao tầng: '+(f.h||300)+' cm',ic:'↕',fn:()=>heightFloor(f)},
  '-',
  {t:'Giữ khung ngoài + thang đồng bộ các tầng',sub:'Sửa ở tầng nào, các tầng khác tự theo',ck:()=>S.sync!==false,fn:()=>{S.sync=S.sync===false;commit()}},
  {t:'Nhận lại khung ngoài + thang từ tầng này',sub:'Đánh dấu lại tường bao & vùng thang rồi đồng bộ',ic:'🔗',fn:()=>{S.walls.forEach(w=>{if(w.sy)delete w.sy});const a=markFrame(),b=markCoreZones();commit();toast(`Đã đánh dấu ${a} tường bao và ${b} vùng thang`)}},
  {t:'Hiện mờ tầng kề bên khi vẽ',ck:()=>PREF.ghost!==false,fn:()=>{PREF.ghost=PREF.ghost===false;savePref();req()}},
  '-',
  {t:'Xoá tầng này',ic:'🗑',fn:()=>delFloor(f.id)}])}
function drawGhost(c,ex){if(ex||PREF.ghost===false||!S.fl||S.fl.length<2)return;const s=flSorted(),i=s.findIndex(f=>f.id===S.cf);const g=s[i-1]||s[i+1];if(!g||!g.data)return;
 c.save();c.globalAlpha=.2;c.fillStyle='#3d6a9a';for(const w of g.data.walls){quad(c,w,-w.t/2,wlen(w)+w.t/2);c.fill()}c.restore()}
function syncRowHTML(k,o){if(!S.fl||S.fl.length<2||!['wall','item','room'].includes(k))return '';return `<label class="ck3" style="margin-top:10px"><input type="checkbox" data-sy ${o.sy?'checked':''}> 🔗 Giữ nguyên ở mọi tầng (khung ngoài / thang)</label>`}

/* --- lệnh nhanh tiếng Việt --- */
function localFloor(text){const n=norm(text).replace(/\s+/g,' ').trim();let m;
 if(/(^| )(them|tao|lam|xay|mo)( .*)? ham( |$)/.test(n)&&!/(^| )(sang|vao|xem|ve|den)( |$)/.test(n)){addFloor(-1,/trong/.test(n)?'empty':'core');return {msg:'Đã thêm tầng hầm, giữ nguyên khung ngoài và thang bộ/thang máy.'}}
 if((m=n.match(/(?:^| )(?:them|tao|lam|xay)\s+(\d{1,2})?\s*(?:tang lau|lau|tang)(?:\s+(\d{1,2}))?(?: |$)/))&&!/ham/.test(n)){
  normFloors();const top=flSorted().pop().lv;let k=m[1]?+m[1]:1;if(m[2]&&!m[1])k=Math.max(1,+m[2]-top);k=Math.min(k,8);
  const mode=/trong/.test(n)?'empty':/(nhan ban|giong|copy|sao chep)/.test(n)?'full':'core';for(let i=0;i<k;i++)addFloor(1,mode);
  return {msg:`Đã thêm ${k} tầng lầu. Khung ngoài, cầu thang và thang máy được giữ nguyên ở mọi tầng; các phòng bên trong để trống cho bạn thiết kế.`}}
 if((m=n.match(/(?:^| )(?:sang|vao|xem|den|chuyen|len|xuong|ve)(?: toi| den| lai| sang)?\s+(tang tret|tret|tang ham|ham|lau|tang)(?:\s*(\d{1,2}))?(?: |$)/))){
  normFloors();const w=m[1],num=m[2]?+m[2]:null;const lv=/tret/.test(w)?0:/ham/.test(w)?-(num||1):w==='lau'?(num||1):(num||1)-1;
  const f=S.fl.find(x=>x.lv===lv);if(!f)return {msg:'Chưa có tầng đó. Hãy nói “thêm lầu” hoặc “thêm tầng hầm” trước.',err:true};switchFloor(f.id,true);return {msg:'Đã chuyển sang '+f.name+'.'}}
 return null}

function init(){const saved=LS.get('mb_cur',null);if(saved&&Array.isArray(saved.walls))S=Object.assign(blank(),saved);$('#pname').value=S.name||'';const bg=LS.get('mb_bg',null);if(bg&&bg.src){const img=new Image();img.onload=()=>{BG={...bg,img};refresh()};img.src=bg.src}
 histReset();resize();aiUI();chatWelcome();renderOpts();$('#sHint').textContent=HINTS.select;refresh();requestAnimationFrame(()=>{resize();fit()});updStatus()}
window.__mb={get S(){return S},V,applyActions,setTool,fit,hitTest,render,exportCanvas,planMD,parseAI,sysPrompt,localCmd,b3plan,b3opts,switchFloor,addFloor,undo,redo};
init();
})();
