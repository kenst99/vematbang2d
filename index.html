<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vẽ Mặt Bằng 2D</title>
<style>
:root{--bg:#efede8;--canvas:#f6f5f2;--panel:#fff;--ink:#1f2328;--mute:#6a7078;--line:#e4e1db;--soft:#f4f2ee;--acc:#e8692c;--accs:#fde9df;--blue:#2f7de1;--sh:0 6px 24px rgba(30,30,30,.13)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{display:grid;grid-template-columns:78px 1fr 336px;grid-template-rows:54px 1fr 30px;height:100vh;height:100dvh}
#top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;min-width:0}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:20px;height:20px}
#pname{border:1px solid transparent;border-radius:8px;padding:5px 8px;font-weight:650;width:190px;background:transparent;min-width:0}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--soft);outline:none}
.tb{display:flex;align-items:center;gap:2px;margin-left:4px;overflow-x:auto;min-width:0}
.ib{height:36px;min-width:36px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#3a3f45;white-space:nowrap;flex:none}
.ib:hover{background:var(--soft)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.ib svg{width:20px;height:20px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.grow{flex:1}
.btn-ai{background:linear-gradient(135deg,#ff8a4c,#e8592c);color:#fff;font-weight:650;height:36px;padding:0 14px;border-radius:10px;box-shadow:0 2px 8px rgba(232,105,44,.35);flex:none}
#bPanel{display:none}
#tools{grid-column:1;grid-row:2;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:8px 6px;overflow:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;color:#454b52;font-size:11.5px;font-weight:560;flex:none}
.tool svg{width:24px;height:24px}
.tool:hover{background:var(--soft)}
.tool.on{background:var(--accs);color:var(--acc)}
.tsep{height:1px;background:var(--line);margin:4px 6px;flex:none}
#stage{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;touch-action:none;display:block;outline:none}
#opts{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);border-radius:12px;box-shadow:var(--sh);padding:6px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 80px);overflow-x:auto;white-space:nowrap;z-index:3;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts:empty{display:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:#fff;white-space:nowrap;flex:none}
.chip:hover{border-color:#cfcac2}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.olbl{font-size:12px;color:var(--mute);padding:0 2px 0 6px;flex:none}
.osep{width:1px;height:20px;background:var(--line);flex:none}
.oin{width:78px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
#ctxbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#24282d;color:#fff;border-radius:14px;display:flex;align-items:center;gap:2px;padding:5px;box-shadow:var(--sh);z-index:3;max-width:calc(100% - 20px);overflow-x:auto}
#ctxbar button{color:#fff;padding:7px 10px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap;flex:none}
#ctxbar button:hover{background:rgba(255,255,255,.13)}
#ctxbar .ttl{padding:7px 10px 7px 8px;font-size:12.5px;opacity:.75;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
#bDone{position:absolute;right:14px;bottom:14px;background:var(--acc);color:#fff;font-weight:650;padding:11px 18px;border-radius:12px;box-shadow:var(--sh);z-index:4}
#floors{position:absolute;left:10px;top:58px;display:flex;flex-direction:column;gap:5px;z-index:3;max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
#floors::-webkit-scrollbar{display:none}
#floors .fb{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;box-shadow:var(--sh);min-width:62px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;flex:none}
#floors .fb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#floors .fb.add{font-weight:500;color:#586069;border-style:dashed;background:rgba(255,255,255,.88)}
#zoomc{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:var(--sh);overflow:hidden;z-index:3}
#zoomc button{width:38px;height:38px;font-size:18px;color:#3a3f45}
#zoomc button:hover{background:var(--soft)}
#zoomc svg{width:18px;height:18px;vertical-align:middle}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2;padding:20px}
#empty .card{pointer-events:auto;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:22px 22px 18px;text-align:center;max-width:380px}
#empty h2{margin:0 0 6px;font-size:18px}
#empty p{margin:0 0 14px;color:var(--mute);font-size:13.5px}
#empty .row{justify-content:center;flex-wrap:wrap}
#side{grid-column:3;grid-row:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;padding:8px;gap:4px;border-bottom:1px solid var(--line);align-items:center;flex:none}
.tab{flex:1;padding:8px 4px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mute)}
.tab.on{background:var(--soft);color:var(--ink)}
.sheetclose{display:none;width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--mute)}
.pane{flex:1;overflow:auto;padding:14px;display:none;min-height:0}
.pane.on{display:block}
#pAI.on{display:flex;flex-direction:column;padding:0}
#status{grid-column:1/-1;grid-row:3;display:flex;gap:16px;align-items:center;padding:0 12px;font-size:12px;color:var(--mute);background:var(--panel);border-top:1px solid var(--line);min-width:0}
#sHint{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:560}
.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;outline:none;min-width:0}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
textarea.inp{resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;font-weight:560;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.danger{color:#c43c2c}
.btn.full{width:100%}
.btn.sm{padding:5px 9px;font-size:12px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--acc)}
.sw input[type=color]{width:30px;height:28px;border:0;padding:0;background:none;cursor:pointer}
h3{margin:0 0 12px;font-size:15px}
.muted{color:var(--mute);font-size:12.5px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.ub{position:relative}
.ub em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-size:12px;pointer-events:none}
.ub .inp{padding-right:34px}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.phead canvas{width:64px;height:48px;background:var(--soft);border-radius:10px;flex:none}
.phead h3{margin:0}
.info{background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.info b{font-size:15px}
.rlist{display:flex;flex-direction:column;gap:4px;margin:10px 0 14px}
.rlist button{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;background:var(--soft);text-align:left;font-size:13px}
.rlist button:hover{background:var(--accs)}
.rlist i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:8px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tips{font-size:12.5px;color:var(--mute);padding-left:18px;margin:6px 0}
.tips li{margin-bottom:4px}
kbd{background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;font-family:inherit}
.libtop{position:sticky;top:-14px;background:#fff;padding:0 0 8px;margin-top:-2px;z-index:1}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lcard{border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;user-select:none;-webkit-user-select:none;min-width:0}
.lcard:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(232,105,44,.15)}
.lcard canvas{width:84px;height:62px;pointer-events:none}
.lcard{position:relative}
.lcard .ued{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;background:var(--soft);font-size:12px;display:grid;place-items:center;color:var(--mute)}
.lcard .ued:hover{background:var(--accs);color:var(--acc)}
.lcard.addimg{border-style:dashed;border-color:#e8b49a;background:#fffaf7}
.lcard.addimg .plus{height:62px;display:grid;place-items:center;font-size:22px;color:var(--acc)}
.lcard b{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.lcard i{font-style:normal;font-size:10.5px;color:var(--mute)}
.aicfg{border-bottom:1px solid var(--line);padding:10px 14px;flex:none}
.aicfg summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
.aicfg summary::-webkit-details-marker{display:none}
.aicfg[open] summary{margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.dot.ok{background:#2fa84f}
.note{font-size:12px;color:var(--mute);background:var(--soft);border-radius:9px;padding:8px 10px;margin-bottom:10px;line-height:1.5}
.note code{background:#fff;border-radius:4px;padding:0 4px;font-size:11.5px}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:92%;padding:9px 12px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:#24282d;color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.e{align-self:flex-start;background:#fdecea;color:#9b2c1f}
.msg img{max-width:160px;border-radius:8px;display:block;margin-bottom:6px}
.applied{margin-top:7px;font-size:12px;color:#25803c;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.applied button{text-decoration:underline;color:var(--mute);font-size:12px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#999;margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.aichips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;flex:none;scrollbar-width:none}
.aichips::-webkit-scrollbar{display:none}
.composer{border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;flex:none}
.composer textarea{resize:none;min-height:46px;max-height:130px}
#aiImgPrev{display:flex;gap:6px;align-items:center}
#aiImgPrev img{height:44px;border-radius:6px}
.menu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:6px;min-width:230px;z-index:50;max-height:80vh;overflow:auto}
.menu button{display:flex;width:100%;padding:9px 12px;border-radius:8px;text-align:left;gap:10px;align-items:center;font-size:13.5px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px}
.menu .ck{width:18px;color:var(--acc);font-weight:700;flex:none;text-align:center}
.menu small{display:block;color:var(--mute);font-size:11.5px}
#modal{position:fixed;inset:0;background:rgba(20,20,20,.38);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{background:#fff;border-radius:16px;box-shadow:var(--sh);width:min(480px,100%);max-height:86vh;overflow:auto;padding:18px}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.plist .pi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--soft)}
.plist .pi div{flex:1;min-width:0}
.plist .pi b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbox.wide{width:min(780px,100%)}
.b3cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card3{border:1px solid var(--line);border-radius:12px;padding:12px 12px 4px;margin-bottom:12px}
.card3 h4{margin:0 0 8px;font-size:14px}
.card3 ol{margin:0 0 10px;padding-left:18px;font-size:12.5px;color:var(--mute)}
.card3 ol li{margin-bottom:3px}
.ck3{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px;cursor:pointer}
.ck3 input{width:16px;height:16px;accent-color:var(--acc)}
#b3st{font-size:12.5px}
#b3st.ok{color:#25803c}#b3st.bad{color:#c43c2c}
#b3out{margin-top:10px}
#b3out img{width:100%;border-radius:10px;display:block;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:700px){.b3cols{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-8px);background:#24282d;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:70;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:820px){
 #app{grid-template-columns:1fr;grid-template-rows:52px 1fr calc(62px + env(safe-area-inset-bottom))}
 #stage{grid-column:1;grid-row:2}
 #tools{grid-column:1;grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 6px env(safe-area-inset-bottom);overflow-x:auto;gap:2px}
 .tool{min-width:60px;padding:6px 2px}
 .tsep{width:1px;height:auto;margin:8px 2px}
 #status{display:none}
 #side{position:fixed;left:0;right:0;bottom:0;height:64vh;height:64dvh;z-index:40;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .25s;border-left:0}
 #side.open{transform:none}
 .sheetclose{display:block}
 .tb .lbl{display:none}
 .tb .ib{padding:0 8px}
 #pname{width:110px}
 #bPanel{display:inline-flex}
 .btn-ai{padding:0 11px}
 #opts{top:8px;max-width:calc(100% - 66px);left:8px;transform:none}
 #zoomc{top:8px;right:8px}
 #zoomc button{width:36px;height:36px}
 #ctxbar{bottom:10px}
 .lgrid{grid-template-columns:repeat(4,1fr)}
 .lcard canvas{width:68px;height:52px}
}
@media (max-width:420px){.lgrid{grid-template-columns:repeat(3,1fr)} #pname{width:84px} .brand .logo{display:none}}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <div class="brand">
   <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V3h18v18H3z"/><path d="M3 12h7v9M14 3v6h7"/></svg></div>
   <input id="pname" value="Mặt bằng mới" aria-label="Tên dự án">
  </div>
  <div class="tb">
   <button class="ib" id="bUndo" title="Hoàn tác (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
   <button class="ib" id="bRedo" title="Làm lại (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
   <button class="ib" id="bFix" title="Tự chỉnh, xoay, bố trí tự động"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/></svg><span class="lbl">Tự chỉnh</span></button>
   <span class="sep"></span>
   <button class="ib" id="bFile" title="Dự án"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span class="lbl">Dự án</span></button>
   <button class="ib" id="bTpl" title="Mặt bằng mẫu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">Mẫu</span></button>
   <button class="ib" id="bExport" title="Xuất"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg><span class="lbl">Xuất</span></button>
   <button class="ib" id="b3D" title="Dựng 3D & render bằng Blender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg><span class="lbl">3D / Blender</span></button>
   <button class="ib" id="bView" title="Hiển thị"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">Hiển thị</span></button>
   <button class="ib" id="bHelp" title="Hướng dẫn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/></svg></button>

<script type="text/plain" id="pyCore">
# ===== LÕI DỰNG CẢNH 3D – Vẽ Mặt Bằng 2D → Blender (Blender 3.6 – 5.x) =====
import bpy, bmesh, math, json, os, sys, random
from mathutils import Matrix, Vector

S_ = 0.01            # cm -> m
COLL_NAME = "MatBang2D"
MATS = {}

DOOR_H = {'single': 210, 'main': 225, 'double': 225, 'sliding': 225, 'open': 230, 'garage': 280}
WIN_ZZ = {'win': (90, 220), 'win2': (75, 230), 'glass': (5, 240), 'small': (140, 200)}

# ---------- màu & vật liệu ----------
def hex2lin(h, mul=1.0):
    h = (h or '#cccccc').lstrip('#')
    if len(h) == 3:
        h = ''.join(c * 2 for c in h)
    try:
        r, g, b = [int(h[i:i + 2], 16) / 255 for i in (0, 2, 4)]
    except Exception:
        r = g = b = .8
    def c(v):
        v = min(1.0, max(0.0, v * mul))
        return v / 12.92 if v <= .04045 else ((v + .055) / 1.055) ** 2.4
    return (c(r), c(g), c(b), 1.0)

def mixhex(a, b, t):
    def rgb(h):
        h = (h or '#cccccc').lstrip('#')
        if len(h) == 3: h = ''.join(c * 2 for c in h)
        try: return [int(h[i:i + 2], 16) for i in (0, 2, 4)]
        except Exception: return [204, 204, 204]
    x, y = rgb(a), rgb(b)
    return '#' + ''.join('%02x' % int(round(x[i] * (1 - t) + y[i] * t)) for i in range(3))

def _inp(node, names, val):
    for n in names:
        if n in node.inputs:
            try:
                node.inputs[n].default_value = val
                return True
            except Exception:
                pass
    return False

def _new_mat(key):
    m = bpy.data.materials.new("MB_" + key)
    if bpy.app.version < (5, 0, 0):
        try:
            m.use_nodes = True
        except Exception:
            pass
    return m

def _principled(m):
    nt = getattr(m, 'node_tree', None)
    if nt is None:
        return None
    for n in nt.nodes:
        if n.type == 'BSDF_PRINCIPLED':
            return n
    p = nt.nodes.new('ShaderNodeBsdfPrincipled')
    out = None
    for n in nt.nodes:
        if n.type == 'OUTPUT_MATERIAL':
            out = n
    if out is None:
        out = nt.nodes.new('ShaderNodeOutputMaterial')
    nt.links.new(p.outputs[0], out.inputs[0])
    return p

def mat(key, col, rough=.5, metal=0.0, transm=0.0, emit=0.0, coat=0.0, alpha=1.0):
    if key in MATS:
        return MATS[key]
    m = _new_mat(key)
    p = _principled(m)
    if p:
        _inp(p, ['Base Color'], col)
        _inp(p, ['Roughness'], rough)
        _inp(p, ['Metallic'], metal)
        if transm:
            _inp(p, ['Transmission Weight', 'Transmission'], transm)
            _inp(p, ['IOR'], 1.45)
        if emit:
            _inp(p, ['Emission Color', 'Emission'], col)
            _inp(p, ['Emission Strength'], emit)
        if coat:
            _inp(p, ['Coat Weight', 'Clearcoat'], coat)
        if alpha < 1:
            _inp(p, ['Alpha'], alpha)
    try:
        m.diffuse_color = col
        m.roughness = rough
    except Exception:
        pass
    if transm or alpha < 1:
        for attr, val in (('surface_render_method', 'DITHERED'), ('blend_method', 'HASHED')):
            try:
                setattr(m, attr, val)
            except Exception:
                pass
    MATS[key] = m
    return m

def mat_floor(kind, hexcol):
    key = 'San_%s_%s' % (kind, (hexcol or '').lstrip('#'))
    if key in MATS:
        return MATS[key]
    if kind == 'plain':
        return mat(key, hex2lin(hexcol, .97), .6)
    m = _new_mat(key)
    p = _principled(m)
    MATS[key] = m
    if p is None:
        return m
    nt = m.node_tree
    try:
        tc = nt.nodes.new('ShaderNodeTexCoord')
        br = nt.nodes.new('ShaderNodeTexBrick')
        nt.links.new(tc.outputs['Object'], br.inputs['Vector'])
        _inp(br, ['Scale'], 1.0)
        if kind == 'wood':
            wc = mixhex(hexcol, '#9a6a42', .62)
            _inp(br, ['Color1'], hex2lin(wc, .86))
            _inp(br, ['Color2'], hex2lin(wc, 1.0))
            _inp(br, ['Mortar'], hex2lin(wc, .55))
            _inp(br, ['Mortar Size'], .0012)
            _inp(br, ['Brick Width'], 1.2)
            _inp(br, ['Row Height'], .19)
            br.offset = .37
            _inp(p, ['Roughness'], .42)
            nz = nt.nodes.new('ShaderNodeTexNoise')
            mp = nt.nodes.new('ShaderNodeMapping')
            nt.links.new(tc.outputs['Object'], mp.inputs['Vector'])
            _inp(mp, ['Scale'], (2.0, 30.0, 1.0))
            nt.links.new(mp.outputs['Vector'], nz.inputs['Vector'])
            _inp(nz, ['Scale'], 6.0)
            _inp(nz, ['Detail'], 6.0)
            bp = nt.nodes.new('ShaderNodeBump')
            _inp(bp, ['Strength'], .08)
            nt.links.new(nz.outputs['Fac'], bp.inputs['Height'])
            nt.links.new(bp.outputs['Normal'], p.inputs['Normal'])
        else:
            _inp(br, ['Color1'], hex2lin(hexcol, .98))
            _inp(br, ['Color2'], hex2lin(hexcol, 1.03))
            _inp(br, ['Mortar'], hex2lin('#a8a49c'))
            _inp(br, ['Mortar Size'], .003)
            _inp(br, ['Brick Width'], .6)
            _inp(br, ['Row Height'], .6)
            br.offset = 0.0
            _inp(p, ['Roughness'], .16)
            bp = nt.nodes.new('ShaderNodeBump')
            _inp(bp, ['Strength'], .25)
            try:
                bp.invert = True
            except Exception:
                pass
            nt.links.new(br.outputs['Fac'], bp.inputs['Height'])
            nt.links.new(bp.outputs['Normal'], p.inputs['Normal'])
        nt.links.new(br.outputs['Color'], p.inputs['Base Color'])
    except Exception as e:
        print('floor material fallback:', e)
        _inp(p, ['Base Color'], hex2lin(hexcol, .8))
    return m

def std_mats():
    return {
        'wood': lambda: mat('wood', hex2lin('#9c7048'), .45),
        'woodl': lambda: mat('woodl', hex2lin('#c9a27a'), .45),
        'dark': lambda: mat('dark', hex2lin('#2b2d31'), .45),
        'white': lambda: mat('white', hex2lin('#f3f2ef'), .3),
        'metal': lambda: mat('metal', hex2lin('#b8bcc2'), .3, 1.0),
        'chrome': lambda: mat('chrome', hex2lin('#e6e6e6'), .08, 1.0),
        'mirror': lambda: mat('mirror', hex2lin('#f0f0f0'), .01, 1.0),
        'glass': lambda: mat('glass', (1, 1, 1, 1), .02, 0.0, 1.0),
        'tint': lambda: mat('tint', hex2lin('#3c4650'), .05, .2, .6),
        'black': lambda: mat('black', hex2lin('#141518'), .15, 0.0, 0.0, 0.0, .6),
        'stone': lambda: mat('stone', hex2lin('#d8d4cd'), .22),
        'green': lambda: mat('green', hex2lin('#3f7d3a'), .6),
        'soil': lambda: mat('soil', hex2lin('#a85f3a'), .7),
        'water': lambda: mat('water', hex2lin('#3fa7d6'), .04, 0.0, .55),
        'gold': lambda: mat('gold', hex2lin('#d4a24c'), .3, 1.0),
        'lamp': lambda: mat('lamp', hex2lin('#fff2d6'), .5, 0.0, 0.0, 6.0),
        'leather': lambda: mat('leather', hex2lin('#3b2a22'), .5),
        'red': lambda: mat('red', hex2lin('#c0392b'), .4),
        'fruit': lambda: mat('fruit', hex2lin('#e8892c'), .4),
        'felt': lambda: mat('felt', hex2lin('#2e7d4f'), .9),
        'b0': lambda: mat('b0', hex2lin('#8e3b2f'), .6), 'b1': lambda: mat('b1', hex2lin('#2f5d8e'), .6),
        'b2': lambda: mat('b2', hex2lin('#d8b25a'), .6), 'b3': lambda: mat('b3', hex2lin('#3d7a55'), .6),
        'b4': lambda: mat('b4', hex2lin('#e8e2d4'), .6),
        'grass': lambda: mat('grass', hex2lin('#5f9a47'), .85),
        'sand': lambda: mat('sand', hex2lin('#e3cf9a'), .9),
        'yellow': lambda: mat('yellow', hex2lin('#f2c230'), .35),
        'blue': lambda: mat('blue', hex2lin('#2f7de1'), .35),
        'pink': lambda: mat('pink', hex2lin('#e8648a'), .35),
        'leaf': lambda: mat('leaf', hex2lin('#3f8a3a'), .7),
        'trunk': lambda: mat('trunk', hex2lin('#7a5230'), .8),
        'roofred': lambda: mat('roofred', hex2lin('#b9442b'), .5),
    }

# ---------- bmesh helpers (toạ độ kiểu bản vẽ: x phải, y xuống; đổi sang Blender: y -> -y) ----------
def _mi(bm, res, mi):
    # bmesh tái dùng ô nhớ cũ nên mặt mới không nằm cuối danh sách -> lấy mặt qua các đỉnh vừa tạo
    for v in res.get('verts', []):
        for f in v.link_faces:
            f.material_index = mi

def add_box(bm, cx, cy, z0, L, T, H, ang, mi):
    if L <= 0 or T <= 0 or H <= 0:
        return
    M = Matrix.Translation((cx * S_, -cy * S_, (z0 + H / 2) * S_)) @ Matrix.Rotation(-ang, 4, 'Z') @ Matrix.Diagonal((L * S_, T * S_, H * S_, 1))
    res = bmesh.ops.create_cube(bm, size=1.0, matrix=M)
    _mi(bm, res, mi)

def add_cyl(bm, cx, cy, z, rx, ry, h, mi, axis='Z', ang=0.0, seg=28):
    if axis == 'Z':
        M = Matrix.Translation((cx * S_, -cy * S_, (z + h / 2) * S_)) @ Matrix.Rotation(-ang, 4, 'Z') @ Matrix.Diagonal((2 * rx * S_, 2 * ry * S_, h * S_, 1))
    else:  # trục nằm ngang theo y cục bộ (bánh xe), z = tâm
        M = Matrix.Translation((cx * S_, -cy * S_, z * S_)) @ Matrix.Rotation(-ang, 4, 'Z') @ Matrix.Rotation(math.pi / 2, 4, 'X') @ Matrix.Diagonal((2 * rx * S_, 2 * ry * S_, h * S_, 1))
    res = bmesh.ops.create_cone(bm, cap_ends=True, cap_tris=False, segments=seg, radius1=.5, radius2=.5, depth=1.0, matrix=M)
    _mi(bm, res, mi)

def add_sph(bm, cx, cy, z, r, mi):
    M = Matrix.Translation((cx * S_, -cy * S_, z * S_)) @ Matrix.Diagonal((2 * r * S_, 2 * r * S_, 2 * r * S_, 1))
    res = bmesh.ops.create_uvsphere(bm, u_segments=18, v_segments=10, radius=.5, matrix=M)
    _mi(bm, res, mi)

# ---------- nội thất 3D (toạ độ cục bộ cm, lưng ở -y) ----------
def B(x, y, z, w, d, h, m, a=0.0): return ('box', x, y, z, w, d, h, m, a)
def C(x, y, z, rx, ry, h, m, axis='Z'): return ('cyl', x, y, z, rx, ry, h, m, axis)
def SP(x, y, z, r, m): return ('sph', x, y, z, r, m)

def legs(w, d, h, r=2.2, inset=6, m='dark'):
    return [C(sx * (w / 2 - inset), sy * (d / 2 - inset), 0, r, r, h, m) for sx in (-1, 1) for sy in (-1, 1)]

def table(w, d, h=74, top=4, m='main', lm='dark'):
    return legs(w, d, h - top, 2.2, 6, lm) + [B(0, 0, h - top, w, d, top, m)]

def chair(x, y, a, cw, cd, m='wood'):
    c, s = math.cos(a), math.sin(a)
    tr = lambda lx, ly: (x + lx * c - ly * s, y + lx * s + ly * c)
    ps = []
    for lx, ly in ((-cw / 2 + 3, -cd / 2 + 3), (cw / 2 - 3, -cd / 2 + 3), (-cw / 2 + 3, cd / 2 - 3), (cw / 2 - 3, cd / 2 - 3)):
        px, py = tr(lx, ly)
        ps.append(C(px, py, 0, 1.5, 1.5, 44, 'dark'))
    px, py = tr(0, 0)
    ps.append(B(px, py, 44, cw, cd, 5, m, a))
    px, py = tr(0, -cd / 2 + 2.5)
    ps.append(B(px, py, 49, cw, 4, 42, m, a))
    return ps

def dining(w, d, n):
    cd = min(40, d * .26); ends = n >= 6; tx = cd if ends else 0
    tw, td = w - 2 * tx, d - 2 * cd
    k = int(round((n - 2) / 2 if ends else n / 2)); cw = min(44, tw / k - 8); ew = min(44, td - 8)
    ps = []
    for i in range(k):
        x = -tw / 2 + tw * (i + .5) / k
        ps += chair(x, -d / 2 + cd / 2 + 4, 0, cw, cd, 'mainl')
        ps += chair(x, d / 2 - cd / 2 - 4, math.pi, cw, cd, 'mainl')
    if ends:
        ps += chair(-w / 2 + cd / 2 + 4, 0, -math.pi / 2, ew, cd, 'mainl')
        ps += chair(w / 2 - cd / 2 - 4, 0, math.pi / 2, ew, cd, 'mainl')
    return ps + table(tw, td, 75, 4, 'main', 'dark')

def round4(w, d):
    cd = min(40, min(w, d) * .24); r = min(w, d) / 2 - cd + 6; cw = min(42, r)
    ps = []
    for i in range(4):
        t = i * math.pi / 2 - math.pi / 2; R = r + cd / 2 - 8
        ps += chair(math.cos(t) * R, math.sin(t) * R, t + math.pi / 2, cw, cd, 'mainl')
    return ps + [C(0, 0, 0, 25, 25, 3, 'dark'), C(0, 0, 3, 5, 5, 68, 'dark'), C(0, 0, 71, r, r, 4, 'main')]

def sofa(w, d):
    a = min(20, w * .15); b = min(24, d * .28)
    ps = legs(w, d, 8, 2.5, 8) + [B(0, 0, 8, w, d, 30, 'main'), B(0, -d / 2 + b / 2, 8, w, b, 72, 'main'),
                                   B(-w / 2 + a / 2, 0, 8, a, d, 55, 'main'), B(w / 2 - a / 2, 0, 8, a, d, 55, 'main')]
    n = 1 if w < 115 else 2 if w < 185 else 3; sw = (w - 2 * a) / n
    for i in range(n):
        x = -w / 2 + a + sw * (i + .5)
        ps += [B(x, b / 2, 38, sw - 2, d - b - 2, 12, 'mainl'), B(x, -d / 2 + b + 6, 38, sw - 4, 12, 36, 'mainl')]
    return ps

def sofaL(w, d):
    sd = min(95, d * .6); cw = min(95, w * .42); a, b = 18, 22
    ps = [B(0, -d / 2 + sd / 2, 8, w, sd, 30, 'main'), B(w / 2 - cw / 2, -d / 2 + sd + (d - sd) / 2, 8, cw, d - sd, 30, 'main'),
          B(0, -d / 2 + b / 2, 8, w, b, 72, 'main'), B(-w / 2 + a / 2, -d / 2 + sd / 2, 8, a, sd, 55, 'main'), B(w / 2 - a / 2, 0, 8, a, d, 55, 'main')]
    x0, x1 = -w / 2 + a, w / 2 - cw
    n = max(1, int(round((x1 - x0) / 70))); sw = (x1 - x0) / n
    for i in range(n):

def _img_mat(uid, dataurl):
    key = 'img_' + uid
    if key in MATS: return MATS[key]
    m = _new_mat(key); MATS[key] = m
    p = _principled(m)
    try:
        import base64, tempfile
        head, b64 = dataurl.split(',', 1)
        ext = 'webp' if 'webp' in head else ('jpg' if 'jpeg' in head else 'png')
        fp = os.path.join(tempfile.gettempdir(), 'mb2d_u_%s.%s' % (uid, ext))
        with open(fp, 'wb') as f: f.write(base64.b64decode(b64))
        im = bpy.data.images.load(fp, check_existing=False)
        try: im.pack()
        except Exception: pass
        nt = m.node_tree
        tx = nt.nodes.new('ShaderNodeTexImage'); tx.image = im
        nt.links.new(tx.outputs['Color'], p.inputs['Base Color'])
        _inp(p, ['Roughness'], .6)
    except Exception as e:
        print('[MatBang2D] Không nạp được ảnh nội thất:', e)
    return m

def _user_obj(coll, it, e, k, name):
    w = float(it.get('w', 60)); d = float(it.get('d', 60)); h = float(e.get('h') or 60)
    pts = e.get('out') or [[0, 0], [1, 0], [1, 1], [0, 1]]
    L = []
    for u, v in pts:
        q = ((float(u) - .5) * w, (float(v) - .5) * d)
        if not L or abs(L[-1][0] - q[0]) > .05 or abs(L[-1][1] - q[1]) > .05: L.append(q)
    if len(L) > 2 and abs(L[0][0] - L[-1][0]) < .05 and abs(L[0][1] - L[-1][1]) < .05: L.pop()
    if len(L) < 3: L = [(-w / 2, -d / 2), (w / 2, -d / 2), (w / 2, d / 2), (-w / 2, d / 2)]
    BL = [(x * S_, -y * S_) for x, y in L]
    ar = sum(BL[i][0] * BL[(i + 1) % len(BL)][1] - BL[(i + 1) % len(BL)][0] * BL[i][1] for i in range(len(BL)))
    if ar < 0: BL.reverse()
    side = mat('uc_' + (e.get('col') or '#cccccc').lstrip('#'), hex2lin(e.get('col') or '#cccccc', .92), .6)
    top = _img_mat(it.get('type', 'u')[2:], e['img']) if e.get('img') else side
    bm = bmesh.new()
    try:
        uv = bm.loops.layers.uv.new('UVMap')
        bot = [bm.verts.new((x, y, 0)) for x, y in BL]
        tp = [bm.verts.new((x, y, h * S_)) for x, y in BL]
        ft = bm.faces.new(tp); ft.material_index = 0
        fb = bm.faces.new(list(reversed(bot))); fb.material_index = 1
        n = len(BL)
        for i in range(n):
            f = bm.faces.new([bot[i], bot[(i + 1) % n], tp[(i + 1) % n], tp[i]]); f.material_index = 1
        for lp in ft.loops:
            co = lp.vert.co
            lp[uv].uv = (co.x / (w * S_) + .5, co.y / (d * S_) + .5)
    except Exception as ex:
        print('[MatBang2D] Đường viền lỗi, dùng khối chữ nhật:', ex)
        bm.free(); bm = bmesh.new()
        add_box(bm, 0, 0, 0, w, d, h, 0, 1)
    ob = _mesh_obj(coll, name, bm, [top, side])
    ob.location = (float(it['x']) * S_, -float(it['y']) * S_, 0)
    ob.rotation_euler = (0, 0, -math.radians(float(it.get('rot', 0))))
    return ob

def _coll(clear=True):
    sc = bpy.context.scene
    c = bpy.data.collections.get(COLL_NAME)
    if c is None:
        c = bpy.data.collections.new(COLL_NAME)
    if c.name not in sc.collection.children:
        try:
            sc.collection.children.link(c)
        except Exception:
            pass
    for ob in (list(c.objects) if clear else []):
        data = ob.data
        bpy.data.objects.remove(ob, do_unlink=True)
        if data is not None and data.users == 0:
            for coll in (bpy.data.meshes, bpy.data.lights, bpy.data.cameras, bpy.data.curves):
                if data.name in coll and coll[data.name] == data:
                    coll.remove(data)
                    break
    if clear:
        for m in list(bpy.data.materials):
            if m.name.startswith('MB_') and m.users == 0:
                bpy.data.materials.remove(m)
        MATS.clear()
    return c

def _obj(coll, name, data):
    ob = bpy.data.objects.new(name, data)
    coll.objects.link(ob)
    return ob

def _mesh_obj(coll, name, bm, mats):
    me = bpy.data.meshes.new(name)
    bm.normal_update()
    bm.to_mesh(me)
    bm.free()
    for m in mats:
        me.materials.append(m)
    return _obj(coll, name, me)

# ---------- nhiều tầng ----------
SLAB = 20.0
_OUT_WORDS = ('san', 'vuon', 'ho boi', 'bai ', 'garden', 'ho ca', 'pool')

def _is_out(name):
    import unicodedata
    n = unicodedata.normalize('NFD', str(name or '').lower().replace('\u0111', 'd')).encode('ascii', 'ignore').decode()
    n = n + ' '
    return any(n.startswith(w) or (' ' + w) in n for w in _OUT_WORDS)

def _prism(pts, z0, z1):
    b = bmesh.new()
    try:
        top = [b.verts.new((x * S_, -y * S_, z1 * S_)) for x, y in pts]
        bot = [b.verts.new((x * S_, -y * S_, z0 * S_)) for x, y in pts]
        n = len(pts)
        b.faces.new(top); b.faces.new(bot[::-1])
        for i in range(n):
            b.faces.new((top[i], bot[i], bot[(i + 1) % n], top[(i + 1) % n]))
        bmesh.ops.recalc_face_normals(b, faces=list(b.faces))
        return b
    except Exception:
        b.free()
        return None

# ---------- dựng cảnh ----------
def _build_one(plan, opts=None):
    opts = dict(opts or {})
    plan = plan or {}
    geom = not opts.get('_nogeom')
    multi = bool(opts.get('_multi'))
    noenv = bool(opts.get('_noenv'))
    coll = _coll(not opts.get('_keep'))
    SM = std_mats()
    walls = plan.get('walls', []) or []
    ops = plan.get('openings', []) or []
    rooms = [r for r in (plan.get('rooms', []) or []) if len(r.get('pts', [])) >= 3]
    items = plan.get('items', []) or []
    view = opts.get('view', 'iso')
    light = opts.get('light', 'day')
    Hdef = float(opts.get('wall_h', 300) or 300)
    ceiling = bool(opts.get('ceiling', view == 'eye'))
    cut = 110 if (opts.get('cutaway') and view != 'eye') else 0
    if cut: ceiling = False
    wallcol = opts.get('wall_color', '#f2efe9')
    stats = {'walls': 0, 'rooms': len(rooms), 'items': 0, 'lights': 0}

    # --- tường + cửa ---
    wall_m = mat('wall', hex2lin(wallcol), .85)
    MATS['wall'] = wall_m
    cap_m = mat('wallcap', hex2lin('#34373c'), .7) if view == 'top' else wall_m
    bm = bmesh.new()
    bmd = bmesh.new(); dmats = []  # cửa & cửa sổ
    def dmi(key):
        m = SM[key]() if key in SM else MATS[key]
        if m not in dmats: dmats.append(m)
        return dmats.index(m)
    mat('door_main', hex2lin('#6b4126'), .4)
    wid = {w['id']: w for w in walls}
    maxH = 0
    for w in (walls if geom else []):
        x1, y1, x2, y2 = float(w['x1']), float(w['y1']), float(w['x2']), float(w['y2'])
        L = math.hypot(x2 - x1, y2 - y1)
        if L < 1: continue
        t = float(w.get('t', 20) or 20); H = float(w.get('h') or Hdef)
        if abs(H - 300) < .01 and abs(Hdef - 300) > .01: H = Hdef
        maxH = max(maxH, H)
        if cut: H = min(H, cut)
        ux, uy = (x2 - x1) / L, (y2 - y1) / L; nx, ny = -uy, ux; ang = math.atan2(uy, ux)
        def seg(a, b, z0, z1, t_=t, mi=0):
            if b - a <= .1 or z1 - z0 <= .1: return
            s = (a + b) / 2
            add_box(bm, x1 + ux * s, y1 + uy * s, z0, b - a, t_, z1 - z0, ang, mi)
        mine = sorted([o for o in ops if o.get('wall') == w['id']], key=lambda o: o['pos'])
        cur = -t / 2
        for o in mine:
            a, b = o['pos'] - o['w'] / 2, o['pos'] + o['w'] / 2
            if a > cur: seg(cur, a, 0, H)
            cur = max(cur, b)
        if cur < L + t / 2: seg(cur, L + t / 2, 0, H)
        for o in mine:
            a, b = o['pos'] - o['w'] / 2, o['pos'] + o['w'] / 2
            W = o['w']; cx, cy = x1 + ux * o['pos'], y1 + uy * o['pos']
            if o.get('kind') == 'window':
                sill, top = WIN_ZZ.get(o.get('type'), (90, 220)); top = min(top, H - 5)
                if top - sill < 20:
                    seg(a, b, 0, H); continue
                seg(a, b, 0, sill); seg(a, b, top, H)
                fr = 5; gm = dmi('glass'); fm = dmi('dark')
                add_box(bmd, cx, cy, sill, W, t * .5, 3, ang, fm)
                add_box(bmd, cx, cy, top - 3, W, t * .5, 3, ang, fm)
                for e in (-1, 1):
                    add_box(bmd, cx + ux * e * (W / 2 - fr / 2), cy + uy * e * (W / 2 - fr / 2), sill, fr, t * .5, top - sill, ang, fm)
                if o.get('type') != 'small':
                    add_box(bmd, cx, cy, sill, 4, t * .45, top - sill, ang, fm)
                add_box(bmd, cx, cy, sill + 3, W - 2 * fr, 1.2, top - sill - 6, ang, gm)
                add_box(bmd, cx + nx * (t / 2 + 2), cy + ny * (t / 2 + 2), sill - 3, W + 6, 6, 3, ang, dmi('stone'))
            else:
                typ = o.get('type', 'single'); DH = min(DOOR_H.get(typ, 210), H - 8)
                seg(a, b, DH, H)
                sg = 1 if o.get('side', True) else -1
                e1 = (cx - ux * W / 2, cy - uy * W / 2); e2 = (cx + ux * W / 2, cy + uy * W / 2)
                woodm = dmi('wood') if typ != 'main' else dmi('door_main')
                def leaf(hg, ot, R, openang=math.radians(80)):
                    hx, hy = hg[0] + nx * sg * (t / 2 - 2), hg[1] + ny * sg * (t / 2 - 2)
                    dx, dy = ot[0] - hg[0], ot[1] - hg[1]; dl = math.hypot(dx, dy) or 1; dx, dy = dx / dl, dy / dl
                    lx = math.cos(openang) * dx + math.sin(openang) * nx * sg; ly = math.cos(openang) * dy + math.sin(openang) * ny * sg
                    add_box(bmd, hx + lx * R / 2, hy + ly * R / 2, 0, R - 1, 4, DH - 1, math.atan2(ly, lx), woodm)
                    add_box(bmd, hx + lx * (R - 8), hy + ly * (R - 8), 100, 2, 7, 2, math.atan2(ly, lx), dmi('chrome'))
                if typ == 'double':
                    leaf(e1, (cx, cy), W / 2); leaf(e2, (cx, cy), W / 2)
                elif typ == 'sliding':
                    for k, (pa, pb) in enumerate(((e1, (cx + ux * W * .06, cy + uy * W * .06)), ((cx - ux * W * .06, cy - uy * W * .06), e2))):
                        off = (-1 if k == 0 else 1) * t * .16
                        mx, my = (pa[0] + pb[0]) / 2 + nx * off, (pa[1] + pb[1]) / 2 + ny * off
                        add_box(bmd, mx, my, 0, math.hypot(pb[0] - pa[0], pb[1] - pa[1]), 3, DH, ang, dmi('dark'))
                        add_box(bmd, mx, my, 4, math.hypot(pb[0] - pa[0], pb[1] - pa[1]) - 8, 3.4, DH - 8, ang, dmi('glass'))
                elif typ == 'garage':
                    add_box(bmd, cx, cy, 0, W, 4, DH, ang, dmi('metal'))
                    for z in range(10, int(DH), 12):
                        add_box(bmd, cx + nx * 2.2, cy + ny * 2.2, z, W, .8, .8, ang, dmi('dark'))
                elif typ != 'open':
                    hg, ot = (e2, e1) if o.get('flip') else (e1, e2)
                    leaf(hg, ot, W)
    if maxH == 0: maxH = Hdef
    if opts.get('_fh'): maxH = float(opts['_fh'])
    if len(bm.faces):
        if view == 'top':
            bm.normal_update()
            for f in bm.faces:
                if f.normal.z > .9: f.material_index = 1
        _mesh_obj(coll, 'MB_Tuong', bm, [wall_m, cap_m])
        stats['walls'] = len(walls)
    else:
        bm.free()
    if len(bmd.faces):
        ob = _mesh_obj(coll, 'MB_CuaDi_CuaSo', bmd, dmats)
    else:
        bmd.free()

    # --- sàn & trần ---
    allpts = []
    for w in walls: allpts += [(w['x1'], w['y1']), (w['x2'], w['y2'])]
    def _pip(px, py, poly):
        ins = False
        for i in range(len(poly)):
            x1, y1 = poly[i]; x2, y2 = poly[(i + 1) % len(poly)]
            if (y1 > py) != (y2 > py) and px < (x2 - x1) * (py - y1) / ((y2 - y1) or 1e-9) + x1: ins = not ins
        return ins
    def _area(poly):
        return abs(sum(poly[i][0] * poly[(i + 1) % len(poly)][1] - poly[(i + 1) % len(poly)][0] * poly[i][1] for i in range(len(poly)))) / 2
    _polys = [[(float(p[0]), float(p[1])) for p in r['pts']] for r in rooms]
    _cen = [(sum(p[0] for p in q) / len(q), sum(p[1] for p in q) / len(q)) for q in _polys]
    _ar = [_area(q) for q in _polys]
    slab_m = mat('slab', hex2lin('#bdb9b1'), .85) if (geom and opts.get('_slab')) else None
    if slab_m is not None:
        # sàn bê tông dày 20 cm dưới các phòng trong nhà (và dưới phần nhà của tầng bên dưới); phòng lồng nhau được nâng 0,4 mm / lớp để mặt trên không trùng nhau
        sp = [(_polys[i], r.get('name', 'Phong')) for i, r in enumerate(rooms) if not _is_out(r.get('name', ''))]
        sp += [([(float(p[0]), float(p[1])) for p in pq], 'X%d' % q) for q, pq in enumerate(opts.get('_slab_extra') or [])]
        sar = [_area(q) for q, _ in sp]
        scn = [(sum(p[0] for p in q) / len(q), sum(p[1] for p in q) / len(q)) for q, _ in sp]
        for si, (spts, snm) in enumerate(sp):
            sd = sum(1 for sj in range(len(sp)) if sj != si and (sar[sj] > sar[si] or (sar[sj] == sar[si] and sj < si)) and _pip(scn[si][0], scn[si][1], sp[sj][0]))
            bs = _prism(spts, -SLAB, sd * .04)
            if bs is not None: _mesh_obj(coll, 'MB_Slab_' + snm, bs, [slab_m])
    for ri, r in (enumerate(rooms) if geom else []):
        pts = _polys[ri]; allpts += pts
        # phòng nằm trong phòng khác (vd. sân vườn bao quanh cả nhà) -> nâng sàn lên một lớp để không bị trùng mặt
        depth = sum(1 for rj in range(len(rooms)) if rj != ri and (_ar[rj] > _ar[ri] or (_ar[rj] == _ar[ri] and rj < ri)) and _pip(_cen[ri][0], _cen[ri][1], _polys[rj]))
        b = bmesh.new()
        vs = [b.verts.new((x * S_, -y * S_, .004 + depth * .02)) for x, y in pts]
        try:
            f = b.faces.new(vs)
            b.normal_update()
            if f.normal.z < 0: f.normal_flip()
        except Exception:
            b.free(); continue
        _mesh_obj(coll, 'MB_San_' + r.get('name', 'Phong'), b, [mat_floor(r.get('floor', 'wood'), r.get('color', '#e8d6bd'))])
        if ceiling:
            b = bmesh.new()
            vs = [b.verts.new((x * S_, -y * S_, maxH * S_ - .002)) for x, y in pts]
            try:
                f = b.faces.new(vs); b.normal_update()
                if f.normal.z > 0: f.normal_flip()
                _mesh_obj(coll, 'MB_Tran_' + r.get('name', 'Phong'), b, [mat('ceiling', hex2lin('#fbfaf7'), .9)])
            except Exception:
                b.free()
    for it in items:
        allpts.append((it['x'], it['y']))
    if not allpts: allpts = [(0, 0), (500, 500)]
    X1 = min(p[0] for p in allpts); X2 = max(p[0] for p in allpts); Y1 = min(p[1] for p in allpts); Y2 = max(p[1] for p in allpts)
    if opts.get('_bbox'):
        X1, X2, Y1, Y2 = [float(v) for v in opts['_bbox']]
    cx, cy = (X1 + X2) / 2, (Y1 + Y2) / 2; bw, bh = max(100, X2 - X1), max(100, Y2 - Y1)
    if opts.get('_hi') is not None: maxH = float(opts['_hi'])
    zlo = float(opts.get('_lo', 0) or 0)

    # --- nền đất ---
    if not noenv:
        b = bmesh.new()
        gs = max(bw, bh) * 3
        add_box(b, cx, cy, float(opts.get('_ground_z', -2)), gs, gs, 1.8, 0, 0)
        _mesh_obj(coll, 'MB_Nen', b, [mat('ground', hex2lin(opts.get('ground_color', '#cfcbc3')), .9)])

    # --- nội thất ---
    ulib = plan.get('ulib') or {}
    ctx = {'multi': multi, 'top': bool(opts.get('_top', True))}
    for k, it in (enumerate(items) if geom else []):
        t = it.get('type', 'box')
        if str(t).startswith('u_'):
            e = ulib.get(t[2:]) or {}
            if e.get('base'):
                it = dict(it); it['color'] = e.get('col') or it.get('color'); t = e['base']
            else:
                _user_obj(coll, it, e, k, 'MB_%s_%s' % (e.get('n', 'Do'), it.get('id', k)))
                stats['items'] += 1
                continue
        w = float(it.get('w', 60)); d = float(it.get('d', 60))
        col = it.get('color') or '#cccccc'
        rough = .9 if t in FABRIC else .25 if t in SHINY else .5
        local = {'main': lambda c=col, r_=rough: mat('c_' + c.lstrip('#') + '_%d' % int(r_ * 10), hex2lin(c), r_, 0, 0, 0, .5 if t in SHINY else 0),
                 'mainl': lambda c=col: mat('cl_' + c.lstrip('#'), hex2lin(c, 1.12), .85)}
        ps = parts_for(t, w, d, maxH, k + 1, ctx)
        b = bmesh.new(); used = []
        for p in ps:
            key = p[5] if p[0] == 'sph' else p[7]
            if key in local: m = local[key]()
            elif key in SM: m = SM[key]()
            elif key in MATS: m = MATS[key]
            else: m = local['main']()
            if m not in used: used.append(m)
            mi = used.index(m)
            if p[0] == 'box': add_box(b, p[1], p[2], p[3], p[4], p[5], p[6], p[8], mi)
            elif p[0] == 'cyl': add_cyl(b, p[1], p[2], p[3], p[4], p[5], p[6], mi, p[8])
            else: add_sph(b, p[1], p[2], p[3], p[4], mi)
        ob = _mesh_obj(coll, 'MB_%s_%s' % (t, it.get('id', k)), b, used)
        ob.location = (float(it['x']) * S_, -float(it['y']) * S_, 0)
        ob.rotation_euler = (0, 0, -math.radians(float(it.get('rot', 0))))
        if t not in ('rug', 'pool', 'tvwall', 'ac') and opts.get('bevel', True):
            try:
                bv = ob.modifiers.new('Bevel', 'BEVEL'); bv.width = .006; bv.segments = 2; bv.limit_method = 'ANGLE'
            except Exception:
                pass
        stats['items'] += 1

    # --- chữ tên phòng ---
    if opts.get('labels') and geom:
        tm = mat('label', hex2lin('#1f2328'), .6, 0, 0, .3)
        for r in rooms:
            pts = r['pts']; a = 0; sx = sy = 0
            for i in range(len(pts)):
                p, q = pts[i], pts[(i + 1) % len(pts)]; f_ = p[0] * q[1] - q[0] * p[1]; a += f_; sx += (p[0] + q[0]) * f_; sy += (p[1] + q[1]) * f_
            if abs(a) < 1: continue
            gx, gy = sx / (3 * a), sy / (3 * a)
            cu = bpy.data.curves.new('MB_Ten_' + r.get('name', ''), 'FONT'); cu.body = r.get('name', ''); cu.size = .3
            cu.align_x = 'CENTER'; cu.align_y = 'CENTER'
            o = _obj(coll, 'MB_Ten_' + r.get('name', ''), cu); o.location = (gx * S_, -gy * S_, (maxH + 3) * S_ if view == 'top' else .02); cu.materials.append(tm)
            try: o.visible_shadow = False
            except Exception: pass

    # --- ánh sáng ---
    sc = bpy.context.scene
    sun_cfg = {'day': (52, 2.6, (1.0, .97, .92)), 'sunset': (9, 2.6, (1.0, .62, .36)), 'night': (-1, 0, (1, 1, 1))}[light if light in ('day', 'sunset', 'night') else 'day']
    if sun_cfg[0] > 0 and not noenv:
        ld = bpy.data.lights.new('MB_MatTroi', 'SUN'); ld.energy = sun_cfg[1]; ld.color = sun_cfg[2]
        try: ld.angle = math.radians(1.2)
        except Exception: pass
        o = _obj(coll, 'MB_MatTroi', ld); o.rotation_euler = (math.radians(90 - sun_cfg[0]), 0, math.radians(float(opts.get('sun_azimuth', 35))))
        stats['lights'] += 1
    wpm = {'day': 6, 'sunset': 18, 'night': 28}.get(light, 9) * float(opts.get('lamp_power', 1.0))
    lcol = (1.0, .93, .84) if light == 'day' else (1.0, .82, .62)
    for r in (rooms if geom else []):
        pts = r['pts']; xs = [p[0] for p in pts]; ys = [p[1] for p in pts]
        a = 0
        for i in range(len(pts)):
            p, q = pts[i], pts[(i + 1) % len(pts)]; a += p[0] * q[1] - q[0] * p[1]
        area = abs(a) / 2 / 1e4
        if area < .5: continue
        ld = bpy.data.lights.new('MB_Den_' + r.get('name', ''), 'AREA'); ld.energy = max(15, area * wpm); ld.color = lcol
        ld.shape = 'RECTANGLE'; ld.size = max(.3, (max(xs) - min(xs)) * S_ * .5); ld.size_y = max(.3, (max(ys) - min(ys)) * S_ * .5)
        o = _obj(coll, 'MB_Den_' + r.get('name', ''), ld)
        o.location = ((min(xs) + max(xs)) / 2 * S_, -(min(ys) + max(ys)) / 2 * S_, (maxH - 12) * S_)
        stats['lights'] += 1

    if noenv:
        return stats

    # --- bầu trời ---
    w = sc.world or bpy.data.worlds.new('MB_World'); sc.world = w
    if bpy.app.version < (5, 0, 0):
        try: w.use_nodes = True
        except Exception: pass
    nt = getattr(w, 'node_tree', None)
    if nt is not None:
        bg = next((n for n in nt.nodes if n.type == 'BACKGROUND'), None)
        if bg is None:
            bg = nt.nodes.new('ShaderNodeBackground')
            out = next((n for n in nt.nodes if n.type == 'OUTPUT_WORLD'), None) or nt.nodes.new('ShaderNodeOutputWorld')
            nt.links.new(bg.outputs[0], out.inputs[0])
        for l in list(bg.inputs['Color'].links): nt.links.remove(l)
        if light == 'night':
            bg.inputs['Color'].default_value = (.01, .015, .035, 1); bg.inputs['Strength'].default_value = .4
        else:
            sky = next((n for n in nt.nodes if n.type == 'TEX_SKY'), None) or nt.nodes.new('ShaderNodeTexSky')
            for st in ('NISHITA', 'MULTIPLE_SCATTERING', 'SINGLE_SCATTERING', 'HOSEK_WILKIE'):
                try: sky.sky_type = st; break
                except Exception: pass
            for attr, val in (('sun_elevation', math.radians(max(sun_cfg[0], 2))), ('sun_rotation', math.radians(float(opts.get('sun_azimuth', 35)))), ('sun_disc', False)):
                try: setattr(sky, attr, val)
                except Exception: pass
            nt.links.new(sky.outputs[0], bg.inputs['Color'])
            bg.inputs['Strength'].default_value = .12 if light == 'day' else .2

    # --- camera ---
    res = int(opts.get('res', 1600))
    cd = bpy.data.cameras.new('MB_Camera'); cam = _obj(coll, 'MB_Camera', cd); sc.camera = cam
    C3 = Vector((cx * S_, -cy * S_, (zlo + maxH) * S_ * .35 if multi else 0)); Lm = max(bw, bh) * S_
    if view == 'top':
        cd.type = 'ORTHO'; asp = min(2.2, max(.45, bw / bh))
        cd.ortho_scale = max(bw, bh) * S_ * 1.08
        cam.location = (C3.x, C3.y, (maxH + 800) * S_); cam.rotation_euler = (0, 0, 0)
        cd.clip_end = 100
        sc.render.resolution_x = res; sc.render.resolution_y = int(res / asp)
    else:
        if view == 'eye' and rooms:
            big = max(rooms, key=lambda r: (max(p[0] for p in r['pts']) - min(p[0] for p in r['pts'])) * (max(p[1] for p in r['pts']) - min(p[1] for p in r['pts'])))
            xs = [p[0] for p in big['pts']]; ys = [p[1] for p in big['pts']]
            x1_, x2_, y1_, y2_ = min(xs), max(xs), min(ys), max(ys)
            obst = [(float(i['x']), float(i['y']), max(float(i['w']), float(i['d'])) / 2) for i in items if i.get('type') not in ('rug', 'pool')]
            for o in ops:
                ww = wid.get(o.get('wall'))
                if not ww: continue
                LL = math.hypot(ww['x2'] - ww['x1'], ww['y2'] - ww['y1']) or 1
                obst.append((ww['x1'] + (ww['x2'] - ww['x1']) / LL * o['pos'], ww['y1'] + (ww['y2'] - ww['y1']) / LL * o['pos'], o['w'] if o.get('kind') == 'door' else 20))
            best = None
            for cx_, cy_, tx_, ty_ in ((x1_ + 45, y2_ - 45, x2_, y1_), (x2_ - 45, y2_ - 45, x1_, y1_), (x1_ + 45, y1_ + 45, x2_, y2_), (x2_ - 45, y1_ + 45, x1_, y2_)):
                sc_ = min([math.hypot(cx_ - ox, cy_ - oy) - orad for ox, oy, orad in obst] or [999])
                if best is None or sc_ > best[0]: best = (sc_, cx_, cy_, tx_, ty_)
            ez = float(opts.get('_eye_z0', 0) or 0) * S_
            loc = Vector((best[1] * S_, -best[2] * S_, 1.55 + ez)); tgt = Vector((best[3] * S_, -best[4] * S_, 1.0 + ez))
            cd.lens = 16
        else:
            cd.lens = 30
            dv = Vector((1.0, -.45, 1.25)) if bh > bw * 1.4 else Vector((.42, -1.0, 1.25))
            tgt = C3 + Vector((0, 0, .2))
            loc = _fit_cam(cd, dv.normalized(), tgt, (X1 * S_, -Y2 * S_, zlo * S_), (X2 * S_, -Y1 * S_, maxH * S_), 16 / 9)
        cam.location = loc
        cam.rotation_euler = (tgt - loc).to_track_quat('-Z', 'Y').to_euler()
        cd.clip_end = 500
        sc.render.resolution_x = res; sc.render.resolution_y = int(res * 9 / 16)
    sc.render.resolution_percentage = 100

    setup_render(opts)
    _ui_view()
    return stats

def build_scene(plan, opts=None):
    plan = plan or {}
    fl = plan.get('floors') or []
    if len(fl) < 2:
        return _build_one(plan, opts)
    return _build_multi(plan, opts)

def _build_multi(plan, opts=None):
    """Nhiều tầng: mỗi tầng dựng riêng rồi nâng lên đúng cao độ; sàn bê tông dày 20 cm giữa các tầng."""
    opts = dict(opts or {})
    fls = sorted(plan['floors'], key=lambda f: f.get('lv', 0))
    view = opts.get('view', 'iso')
    sel = opts.get('floor_sel', 'all')
    # chọn các tầng được hiển thị
    if sel == 'explode':
        show = list(fls)
    else:
        try:
            k = int(sel)
        except Exception:
            k = None
        if sel == 'all' or k is None:
            show = [f for f in fls if f.get('lv', 0) >= 0]
        elif k >= 0:
            show = [f for f in fls if 0 <= f.get('lv', 0) <= k]
        else:
            show = [f for f in fls if f.get('lv', 0) <= k]
    if not show:
        show = fls[:1]
    # cao độ nền của từng tầng (cm)
    z0 = {}
    base = [f for f in fls if f.get('lv', 0) >= 0]
    z = 0.0
    for f in base:
        z0[id(f)] = z
        z += float(f.get('h') or 300)
    neg = [f for f in fls if f.get('lv', 0) < 0]
    z = 0.0
    for f in reversed(neg):
        z -= float(f.get('h') or 300)
        z0[id(f)] = z
    gap = 260.0 if sel == 'explode' else 0.0
    zpos = {}
    for i, f in enumerate(fls):
        zpos[id(f)] = z0[id(f)] + gap * f.get('lv', 0)
    cut_all = bool(opts.get('cutaway')) and view != 'eye'
    stats = {'walls': 0, 'rooms': 0, 'items': 0, 'lights': 0}
    allx, ally = [], []
    for i, f in enumerate(show):
        top = (i == len(show) - 1)
        po = dict(opts)
        po.update({'_slab_extra': ([[tuple(p) for p in r.get('pts', [])] for r in (show[i - 1].get('rooms') or []) if len(r.get('pts', [])) >= 3 and not _is_out(r.get('name', ''))] if i > 0 else []), '_keep': i > 0, '_noenv': True, '_multi': True, '_top': top, '_slab': i > 0,
                   '_fh': float(f.get('h') or 300), 'wall_h': float(f.get('h') or 300),
                   'cutaway': cut_all and (top or sel == 'explode'),
                   'ceiling': bool(opts.get('ceiling', view == 'eye')) and top,
                   'labels': bool(opts.get('labels')) and top and view == 'top'})
        fp = {'walls': f.get('walls') or [], 'openings': f.get('openings') or [], 'rooms': f.get('rooms') or [],
              'items': f.get('items') or [], 'ulib': plan.get('ulib')}
        coll0 = bpy.data.collections.get(COLL_NAME)
        before = set(coll0.objects) if (coll0 is not None and i > 0) else set()
        st = _build_one(fp, po)
        coll1 = bpy.data.collections.get(COLL_NAME)
        dz = zpos[id(f)] * S_
        if dz:
            for ob in coll1.objects:
                if ob not in before:
                    ob.location.z += dz
        for k in stats:
            stats[k] += st.get(k, 0)
        for w in fp['walls']:
            allx += [w['x1'], w['x2']]; ally += [w['y1'], w['y2']]
        for r in fp['rooms']:
            for p in r.get('pts', []):
                allx.append(p[0]); ally.append(p[1])
        for it in fp['items']:
            allx.append(it['x']); ally.append(it['y'])
    topf = show[-1]
    zlo = zpos[id(show[0])]
    zhi = zpos[id(topf)] + float(topf.get('h') or 300)
    env = {'walls': [], 'openings': [], 'rooms': [], 'items': []}
    eo = dict(opts)
    eo.update({'_keep': True, '_multi': True, '_nogeom': True, '_bbox': (min(allx or [0]), max(allx or [500]), min(ally or [0]), max(ally or [500])),
               '_hi': zhi, '_lo': zlo, '_ground_z': (zlo - 22) if zlo < 0 else -2, '_eye_z0': zpos[id(topf)], '_fh': float(topf.get('h') or 300),
               'cutaway': cut_all})
    if view == 'eye':
        env.update({'walls': topf.get('walls') or [], 'openings': topf.get('openings') or [], 'rooms': topf.get('rooms') or [], 'items': topf.get('items') or []})
    r = _build_one(env, eo)
    stats['lights'] += 1
    stats['floors'] = len(show)

def _fit_cam(cd, dv, tgt, lo, hi, aspect):
    q = (-dv).to_track_quat('-Z', 'Y'); qi = q.inverted()
    hf = math.atan(cd.sensor_width / 2 / cd.lens); tx = math.tan(hf) * .94; ty = tx / aspect
    corners = [Vector((x, y, z)) for x in (lo[0], hi[0]) for y in (lo[1], hi[1]) for z in (lo[2], hi[2])]
    def ok(dist):
        loc = tgt + dv * dist
        for c in corners:
            v = qi @ (c - loc)
            if v.z >= -.05 or abs(v.x / -v.z) > tx or abs(v.y / -v.z) > ty: return False
        return True
    a, b = .5, 400.0
    for _ in range(40):
        m = (a + b) / 2
        if ok(m): b = m
        else: a = m
    return tgt + dv * b

def _engine(sc, names):
    for n in names:
        try:
            sc.render.engine = n; return n
        except Exception:
            pass
    return None

def setup_render(opts):
    sc = bpy.context.scene; q = opts.get('quality', 'good')
    if q == 'draft':
        if not _engine(sc, ('BLENDER_EEVEE_NEXT', 'BLENDER_EEVEE')):
            q = 'good'
        else:
            for attr, val in (('use_raytracing', True), ('use_gtao', True), ('use_ssr', True), ('use_soft_shadows', True), ('taa_render_samples', 64)):
                try: setattr(sc.eevee, attr, val)
                except Exception: pass
    if q != 'draft':
        if not _engine(sc, ('CYCLES',)):
            try:
                import addon_utils; addon_utils.enable('cycles', default_set=True); _engine(sc, ('CYCLES',))
            except Exception:
                pass
        try:
            sc.cycles.samples = int(opts.get('samples', 400 if q == 'best' else 96))
            sc.cycles.use_denoising = True
            try: sc.cycles.denoiser = 'OPENIMAGEDENOISE'
            except Exception: pass
            _DEV_PREF['v'] = str(opts.get('device', _DEV_PREF['v']) or 'auto').lower()
            sc.cycles.use_adaptive_sampling = True
        except Exception:
            pass
        _gpu(sc)
    for vt in ('AgX', 'Filmic', 'Standard'):
        try:
            sc.view_settings.view_transform = vt; break
        except Exception:
            pass
    try: sc.view_settings.exposure = float(opts.get('exposure', 0))
    except Exception: pass

_GPU_TRY = ['OPTIX', 'CUDA', 'HIP', 'METAL', 'ONEAPI']
_GPU_BAD = set()
_DEV_PREF = {'v': 'auto'}

def _gpu(sc):
    """Chọn thiết bị render. Bỏ qua loại GPU đã lỗi (vd. OptiX) để thử loại khác, cuối cùng là CPU."""
    if _DEV_PREF['v'] == 'cpu':
        try: sc.cycles.device = 'CPU'
        except Exception: pass
        return 'CPU'
    try:
        pr = bpy.context.preferences.addons['cycles'].preferences
        for t in _GPU_TRY:
            if t in _GPU_BAD: continue
            try: pr.compute_device_type = t
            except Exception: continue
            try: pr.get_devices()
            except Exception: pass
            devs = [d for d in pr.devices if d.type == t]
            if devs:
                for d_ in pr.devices: d_.use = d_.type == t
                sc.cycles.device = 'GPU'; return t
    except Exception:
        pass
    try: sc.cycles.device = 'CPU'
    except Exception: pass
    return 'CPU'

def opts_gpu_allowed():
    return _DEV_PREF['v'] != 'cpu'

def _ui_view():
    try:
        scr = bpy.context.screen
        if scr is None: return
        for area in scr.areas:
            if area.type == 'VIEW_3D':
                sp = area.spaces.active
                sp.shading.type = 'MATERIAL'
                sp.region_3d.view_perspective = 'CAMERA'
    except Exception:
        pass

def _render_once(path):
    sc = bpy.context.scene
    sc.render.filepath = path
    sc.render.image_settings.file_format = 'PNG'
    try:
        if os.path.exists(path): os.remove(path)
    except Exception:
        pass
    ov = None
    try:
        wm = bpy.context.window_manager
        if wm and wm.windows and bpy.context.window is None:
            win = wm.windows[0]; ov = bpy.context.temp_override(window=win, screen=win.screen)
    except Exception:
        ov = None
    if ov is not None:
        with ov: bpy.ops.render.render(write_still=True)
    else:
        bpy.ops.render.render(write_still=True)
    if not os.path.exists(path):
        raise RuntimeError('Render không tạo ra ảnh (thường do lỗi GPU/OptiX)')

def render_to(path):
    """Render; nếu GPU (OptiX/CUDA…) lỗi thì tự đổi loại khác rồi cuối cùng là CPU."""
    sc = bpy.context.scene
    last = None
    for _ in range(len(_GPU_TRY) + 2):
        try:
            _render_once(path)
            return path
        except Exception as e:
            last = e
            if getattr(sc, 'cycles', None) is None or sc.render.engine != 'CYCLES':
                raise
            cur = None
            try:
                if sc.cycles.device == 'GPU':
                    cur = bpy.context.preferences.addons['cycles'].preferences.compute_device_type
            except Exception:
                pass
            print('[MatBang2D] Render lỗi (%s): %s' % (cur or 'CPU', str(e)[:200]))
            if cur and cur != 'NONE':
                _GPU_BAD.add(cur)
                dev = _gpu(sc)
                print('[MatBang2D] Thử lại bằng:', dev)
                continue
            if sc.cycles.device == 'GPU':
                sc.cycles.device = 'CPU'; continue
            raise
    raise last

def _argv():
    a = sys.argv; a = a[a.index('--') + 1:] if '--' in a else []
    o = {}; i = 0
    while i < len(a):
        if a[i].startswith('--') and i + 1 < len(a):
            o[a[i][2:]] = a[i + 1]; i += 2
        else:
            i += 1
    return o

def run_script(plan, opts):
    cli = _argv(); opts = dict(opts)
    for k in ('view', 'light', 'quality', 'device'):
        if k in cli: opts[k] = cli[k]
    for k in ('res', 'samples'):
        if k in cli: opts[k] = int(cli[k])
    info = build_scene(plan, opts)
    print('[MatBang2D] Đã dựng:', info)
    if 'render' in cli:
        p = render_to(os.path.abspath(cli['render']))
        print('[MatBang2D] Đã render:', p)
    return info

import threading, queue, base64, tempfile, time, traceback

class _Srv(ThreadingMixIn, HTTPServer):

class _Handler(BaseHTTPRequestHandler):
    def log_message(self, *a):
        pass

    def _cors(self):
        self.send_header('Access-Control-Allow-Origin', '*')
        self.send_header('Access-Control-Allow-Methods', 'GET, POST, OPTIONS')
        self.send_header('Access-Control-Allow-Headers', 'Content-Type')
        self.send_header('Access-Control-Allow-Private-Network', 'true')

    def _send(self, code, obj):
        b = json.dumps(obj).encode('utf-8')
        self.send_response(code)
        self._cors()
        self.send_header('Content-Type', 'application/json; charset=utf-8')
        self.send_header('Content-Length', str(len(b)))
        self.end_headers()
        self.wfile.write(b)

    def do_OPTIONS(self):
        self.send_response(204)
        self._cors()
        self.send_header('Content-Length', '0')
        self.end_headers()

    def do_GET(self):
        if self.path.startswith('/ping'):
            self._send(200, {'ok': True, 'app': 'mb2d', 'blender': bpy.app.version_string, 'busy': _state['busy'], 'file': bpy.data.filepath or ''})
        else:
            self._send(404, {'ok': False, 'error': 'not found'})

    def do_POST(self):
        kind = 'render' if self.path.startswith('/render') else 'build' if self.path.startswith('/build') else None
        if not kind:
            return self._send(404, {'ok': False, 'error': 'not found'})
        try:
            n = int(self.headers.get('Content-Length', 0))
            body = json.loads(self.rfile.read(n).decode('utf-8') or '{}')
        except Exception as e:
            return self._send(400, {'ok': False, 'error': 'JSON lỗi: %s' % e})
        job = {'kind': kind, 'plan': body.get('plan'), 'opts': body.get('opts') or {}, 'ev': threading.Event(), 'res': None}
        _jobs.put(job)
        if not job['ev'].wait(3600):
            return self._send(504, {'ok': False, 'error': 'Quá thời gian chờ Blender'})
        self._send(200 if job['res'].get('ok') else 500, job['res'])

def _tick():
    try:
        job = _jobs.get_nowait()
    except queue.Empty:
        return 0.25
    _state['busy'] = True
    t0 = time.time()
    try:
        info = build_scene(job['plan'], job['opts'])
        res = {'ok': True, 'info': info}
        if job['kind'] == 'render':
            fp = os.path.join(tempfile.gettempdir(), 'mb2d_render.png')
            render_to(fp)
            with open(fp, 'rb') as f:
                res['image'] = 'data:image/png;base64,' + base64.b64encode(f.read()).decode('ascii')
            out_dir = job['opts'].get('save_dir')
            if out_dir:
                try:
                    import shutil
                    os.makedirs(out_dir, exist_ok=True)
                    dst = os.path.join(out_dir, 'render_%s.png' % time.strftime('%Y%m%d_%H%M%S'))
                    shutil.copyfile(fp, dst); res['saved'] = dst
                except Exception:
                    pass
        res['seconds'] = round(time.time() - t0, 1)
        _state['last'] = ('Render' if job['kind'] == 'render' else 'Dựng') + ' lúc ' + time.strftime('%H:%M:%S')
    except Exception as e:
        res = {'ok': False, 'error': str(e), 'trace': traceback.format_exc()[-1500:]}

def _prefs():

def server_start():
    server_stop()
    p = _prefs()

    except Exception as e:

def unregister():
    server_stop()
    if bpy.app.timers.is_registered(_tick):

    for c in reversed(_classes):
        bpy.utils.unregister_class(c)

function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1]}return a/2}
const areaM2=r=>Math.abs(polyArea(r.pts))/1e4;
function bbox(pts){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;for(const p of pts){x1=Math.min(x1,p[0]);y1=Math.min(y1,p[1]);x2=Math.max(x2,p[0]);y2=Math.max(y2,p[1])}return {x1,y1,x2,y2}}
function centroid(pts){const a=polyArea(pts);if(Math.abs(a)<1){const b=bbox(pts);return [(b.x1+b.x2)/2,(b.y1+b.y2)/2]}let cx=0,cy=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length],f=p[0]*q[1]-q[0]*p[1];cx+=(p[0]+q[0])*f;cy+=(p[1]+q[1])*f}const c=[cx/(6*a),cy/(6*a)];if(!pip(c[0],c[1],pts)){const b=bbox(pts);return [(b.x1+b.x2)/2,(b.y1+b.y2)/2]}return c}
function pip(x,y,pts){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
const perim=pts=>pts.reduce((s,p,i)=>{const q=pts[(i+1)%pts.length];return s+hyp(q[0]-p[0],q[1]-p[1])},0);
function roomAt(x,y){let best=null;for(const r of S.rooms)if(r.pts.length>2&&pip(x,y,r.pts)&&(!best||areaM2(r)<areaM2(best)))best=r;return best}
function onBoundary(x,y,r,eps=3){for(let i=0;i<r.pts.length;i++){const p=r.pts[i],q=r.pts[(i+1)%r.pts.length];const pr=proj(x,y,p[0],p[1],q[0],q[1]);if(pr.s>-eps&&pr.s<pr.L+eps&&Math.abs(pr.n)<eps)return true}return false}
const toLocal=(it,x,y)=>{const c=Math.cos(it.rot*D2R),s=Math.sin(it.rot*D2R),dx=x-it.x,dy=y-it.y;return [dx*c+dy*s,-dx*s+dy*c]};
const toWorld=(it,lx,ly)=>{const c=Math.cos(it.rot*D2R),s=Math.sin(it.rot*D2R);return [it.x+lx*c-ly*s,it.y+lx*s+ly*c]};

/* điểm nối (đầu tường + đỉnh phòng) */
function allRefs(){const a=[];for(const w of S.walls){a.push({o:w,kx:'x1',ky:'y1'},{o:w,kx:'x2',ky:'y2'})}for(const r of S.rooms)for(const p of r.pts)a.push({o:p,kx:0,ky:1});return a}
function coincident(x,y,eps=.6){return allRefs().filter(r=>Math.abs(r.o[r.kx]-x)<eps&&Math.abs(r.o[r.ky]-y)<eps)}
const sameRef=(a,b)=>a.o===b.o&&a.kx===b.kx;
const withBase=refs=>refs.map(r=>({...r,x0:r.o[r.kx],y0:r.o[r.ky]}));
function moveRefs(refs,dx,dy){for(const r of refs){r.o[r.kx]=r.x0+dx;r.o[r.ky]=r.y0+dy}}
function setRefs(refs,x,y){for(const r of refs){r.o[r.kx]=x;r.o[r.ky]=y}}

/* ================= Khung nhìn ================= */
const V={z:.8,ox:0,oy:0};
const s2w=(sx,sy)=>[(sx-V.ox)/V.z,(sy-V.oy)/V.z];
let CW=800,CH=600,dpr=1;
function zoomAt(f,sx,sy){const [wx,wy]=s2w(sx,sy);V.z=clamp(V.z*f,.04,12);V.ox=sx-wx*V.z;V.oy=sy-wy*V.z;req();updStatus()}

/* ================= Bắt điểm (snap) ================= */
let guides=[];
function snapPt(x,y,o={}){
 guides=[];const ex=o.exclude||[];const thr=12/V.z;
 if(o.free)return {x,y,k:'free'};
 let best=null,bd=thr;
 for(const r of allRefs()){if(ex.some(e=>sameRef(e,r)))continue;const d=hyp(r.o[r.kx]-x,r.o[r.ky]-y);if(d<bd){bd=d;best=[r.o[r.kx],r.o[r.ky]]}}
 if(best)return {x:best[0],y:best[1],k:'pt'};
 if(!o.noEdge){for(const w of S.walls){if(ex.some(e=>e.o===w))continue;const p=projW(x,y,w);if(p.s>0&&p.s<p.L&&Math.abs(p.n)<thr*.7)return {x:w.x1+p.ux*p.s,y:w.y1+p.uy*p.s,k:'edge'}}}
 let ax=null;
 if(o.from){const dx=x-o.from.x,dy=y-o.from.y,L=hyp(dx,dy);if(L>1){const a=Math.atan2(dy,dx),ra=Math.round(a/(PI/4))*(PI/4);if(Math.abs(a-ra)<8*D2R){let L2=L*Math.cos(a-ra);if(PREF.snap)L2=Math.round(L2/5)*5;x=o.from.x+Math.cos(ra)*L2;y=o.from.y+Math.sin(ra)*L2;const c=Math.abs(Math.cos(ra)),s=Math.abs(Math.sin(ra));ax=c<1e-6?'v':s<1e-6?'h':'d'}}}
 let gx=null,gy=null;
 if(ax!=='d'){let bx=thr*.8,by=thr*.8;for(const r of allRefs()){if(ex.some(e=>sameRef(e,r)))continue;const px=r.o[r.kx],py=r.o[r.ky];if(ax!=='v'&&Math.abs(px-x)<bx){bx=Math.abs(px-x);gx=px}if(ax!=='h'&&Math.abs(py-y)<by){by=Math.abs(py-y);gy=py}}}
 if(gx!==null)x=gx;if(gy!==null)y=gy;
 if(!ax&&PREF.snap){if(gx===null)x=Math.round(x/5)*5;if(gy===null)y=Math.round(y/5)*5}
 if(gx!==null)guides.push({v:1,c:gx});if(gy!==null)guides.push({v:0,c:gy});
 return {x,y,k:ax?'ang':'grid'};
}

const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function roomRefsFor(r,clone){const others=S.rooms.filter(x=>x!==r),out=[];const add=ref=>{if(!out.some(q=>sameRef(q,ref)))out.push(ref)};
 r.pts.forEach(p=>add({o:p,kx:0,ky:1}));
 for(const w of [...S.walls]){const mx=(w.x1+w.x2)/2,my=(w.y1+w.y2)/2;if(!(onBoundary(w.x1,w.y1,r,1.5)&&onBoundary(w.x2,w.y2,r,1.5)&&onBoundary(mx,my,r,1.5)))continue;let mw=w;if(clone&&others.some(o=>onBoundary(mx,my,o,1.5))){mw={...w,id:nid('w')};S.walls.push(mw);S.openings.filter(o=>o.wall===w.id).forEach(o=>S.openings.push({...o,id:nid('o'),wall:mw.id}))}add({o:mw,kx:'x1',ky:'y1'});add({o:mw,kx:'x2',ky:'y2'})}
 S.items.forEach(it=>{if(pip(it.x,it.y,r.pts))add({o:it,kx:'x',ky:'y'})});S.texts.forEach(t=>{if(pip(t.x,t.y,r.pts))add({o:t,kx:'x',ky:'y'})});
 return out}

function moveRoom(r,dx,dy){const refs=withBase(roomRefsFor(r,true));moveRefs(refs,dx,dy);S.walls.forEach(clampOpenings)}
function rotateAll(deg){const pts=[...S.walls.flatMap(w=>[[w.x1,w.y1],[w.x2,w.y2]]),...S.rooms.flatMap(r=>r.pts),...S.items.map(i=>[i.x,i.y])];if(!pts.length)return;const b=bbox(pts);const cx=Math.round((b.x1+b.x2)/10)*5,cy=Math.round((b.y1+b.y2)/10)*5;const refs=[...allRefs(),...S.items.map(it=>({o:it,kx:'x',ky:'y'})),...S.texts.map(t=>({o:t,kx:'x',ky:'y'})),...S.dims.flatMap(d=>[{o:d,kx:'x1',ky:'y1'},{o:d,kx:'x2',ky:'y2'}])];rotRefs(refs,cx,cy,deg)}
function findRoom(q){if(!q)return null;const byid=S.rooms.find(r=>r.id===q);if(byid)return byid;const ex=S.rooms.find(r=>r.name===q);if(ex)return ex;const n=norm(q);return S.rooms.filter(r=>norm(r.name).includes(n)||n.includes(norm(r.name))).sort((a,b)=>b.name.length-a.name.length)[0]||null}

/* ================= TỰ CHỈNH BẢN VẼ ================= */
function autoFix(o={}){const tol=o.tol||8,tol2=Math.min(5,tol),st={pts:0,str:0,del:0,items:0};
 const W=r=>r.o.x1!==undefined?2:1;
 // 1. gom các điểm gần nhau
 const G=[];for(const r of allRefs()){const x=r.o[r.kx],y=r.o[r.ky];let g=null,bd=tol;for(const q of G){const d=hyp(q.x-x,q.y-y);if(d<=bd){bd=d;g=q}}if(g){g.m.push(r);g.sx+=x*W(r);g.sy+=y*W(r);g.w+=W(r);g.x=g.sx/g.w;g.y=g.sy/g.w}else G.push({x,y,sx:x*W(r),sy:y*W(r),w:W(r),m:[r]})}
 for(const g of G){const tx=r1(g.x),ty=r1(g.y);for(const r of g.m){if(Math.abs(r.o[r.kx]-tx)>.01||Math.abs(r.o[r.ky]-ty)>.01){if(g.m.length>1)st.pts++;r.o[r.kx]=tx;r.o[r.ky]=ty}}}
 // 2. làm thẳng tường gần nằm ngang / thẳng đứng
 for(let pass=0;pass<3;pass++)for(const w of S.walls){const dx=w.x2-w.x1,dy=w.y2-w.y1;if(hyp(dx,dy)<1)continue;if(dx===0||dy===0)continue;const a=Math.abs(Math.atan2(dy,dx))/D2R,da=Math.min(a%90,90-a%90);if(da>(o.ang||6))continue;const A=coincident(w.x1,w.y1),B=coincident(w.x2,w.y2);if(Math.abs(dy)<Math.abs(dx)){const y=r1((w.y1+w.y2)/2);A.forEach(r=>r.o[r.ky]=y);B.forEach(r=>r.o[r.ky]=y)}else{const x=r1((w.x1+w.x2)/2);A.forEach(r=>r.o[r.kx]=x);B.forEach(r=>r.o[r.kx]=x)}if(pass===0)st.str++}
 // 3. thẳng hàng toạ độ lệch vài cm
 for(const ax of['x','y']){const vals=allRefs().map(r=>({r,v:ax==='x'?r.o[r.kx]:r.o[r.ky]})).sort((a,b)=>a.v-b.v);let i=0;while(i<vals.length){let j=i;while(j+1<vals.length&&vals[j+1].v-vals[i].v<=tol2)j++;if(j>i){const vs=vals.slice(i,j+1),u=new Set(vs.map(q=>q.v));if(u.size>1){const m=r1(vs.reduce((s,q)=>s+q.v,0)/vs.length);vs.forEach(q=>{if(ax==='x')q.r.o[q.r.kx]=m;else q.r.o[q.r.ky]=m});st.pts+=u.size-1}}i=j+1}}
 // 4. nối đầu tường hở vào thân tường gần (chữ T)
 for(const w of S.walls)for(const [kx,ky] of [['x1','y1'],['x2','y2']]){const x=w[kx],y=w[ky];if(coincident(x,y).length>1)continue;for(const v of S.walls){if(v===w)continue;const p=projW(x,y,v);if(p.s>2&&p.s<p.L-2&&Math.abs(p.n)>.3&&Math.abs(p.n)<=tol+v.t/2){w[kx]=r1(v.x1+p.ux*p.s);w[ky]=r1(v.y1+p.uy*p.s);st.pts++;break}}}
 // 5. xoá tường quá ngắn, trùng, nằm gọn trong tường khác
 const moveOps=(from,to)=>{for(const op of S.openings)if(op.wall===from.id){const g=og(op);if(!g)continue;const p=projW(g.cx,g.cy,to);op.wall=to.id;op.pos=p.s}};
 S.walls=S.walls.filter(w=>{if(wlen(w)<2){S.openings=S.openings.filter(op=>op.wall!==w.id);st.del++;return false}return true});
 const dead=new Set();for(const w of S.walls){if(dead.has(w))continue;for(const v of S.walls){if(v===w||dead.has(v))continue;const a=projW(v.x1,v.y1,w),b=projW(v.x2,v.y2,w);if(Math.abs(a.n)<1.5&&Math.abs(b.n)<1.5&&Math.min(a.s,b.s)>=-1.5&&Math.max(a.s,b.s)<=a.L+1.5&&wlen(v)<=wlen(w)+.01){moveOps(v,w);w.t=Math.max(w.t,v.t);dead.add(v);st.del++}}}
 if(dead.size)S.walls=S.walls.filter(w=>!dead.has(w));
 // 6. phòng: bỏ đỉnh trùng
 for(const r of S.rooms){r.pts=r.pts.filter((p,i)=>{const q=r.pts[(i+1)%r.pts.length];return hyp(p[0]-q[0],p[1]-q[1])>.5}).map(p=>[r1(p[0]),r1(p[1])])}S.rooms=S.rooms.filter(r=>r.pts.length>=3);
 // 7. đồ đạc: góc xoay gần 90° bội số thì làm tròn, đồ dựa tường hít lại
 for(const it of S.items){const q=Math.round(it.rot/90)*90;if(Math.abs(it.rot-q)>.01&&Math.abs(it.rot-q)<=5){it.rot=norm360(q);st.items++}const F=FURN[it.type];if(F&&F.wall){const x=it.x,y=it.y,rt=it.rot;if(magnet(it,14)&&(Math.abs(x-it.x)>.5||Math.abs(y-it.y)>.5||rt!==it.rot))st.items++}it.x=r1(it.x);it.y=r1(it.y)}
 for(const w of S.walls){w.x1=r1(w.x1);w.y1=r1(w.y1);w.x2=r1(w.x2);w.y2=r1(w.y2)}S.walls.forEach(clampOpenings);
 return st}
function fixMsg(st){const p=[];if(st.str)p.push(`${st.str} tường được làm thẳng`);if(st.pts)p.push(`${st.pts} điểm lệch được khớp`);if(st.del)p.push(`${st.del} tường thừa đã gộp`);if(st.items)p.push(`${st.items} món đồ được căn lại`);return p.length?'Đã tự chỉnh: '+p.join(', ')+'.':'Bản vẽ đã gọn gàng, không có gì cần chỉnh.'}

function rtype(r){const n=norm(r.name);if(/ngu|bed/.test(n))return'bed';if(/khach|sinh hoat|living/.test(n))return'living';if(/bep|kitchen/.test(n))return'kitchen';if(/\ban\b|dining/.test(n))return'dining';if(/wc|ve sinh|tam|toilet/.test(n))return'bath';if(/tho/.test(n))return'altar';if(/lam viec|hoc|office/.test(n))return'office';if(/xe|garage|gara/.test(n))return'garage';if(/ban cong|lo ?gia|san|vuon/.test(n))return'balcony';if(/kho/.test(n))return'store';if(/giat|phoi/.test(n))return'laundry';if(/hanh lang|cau thang|sanh/.test(n))return'hall';const A=areaM2(r);return A<4?'bath':A>=16?'living':'bed'}
